<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mutual Action Plan — Cloud Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--navy:#1E2931;--cyan:#00A9CC;--green:#2E7D32;--red:#C81E10;--amber:#C24A1E;
--g100:#F1F5F9;--g200:#E3E9EE;--g400:#6B7A8D;--g600:#475569;--g800:#1E293B;
--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);background:var(--navy);min-height:100vh;padding:2rem 1rem;}
.wrap{max-width:760px;margin:0 auto;}
.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;}
.logo{height:36px;background:#fff;border-radius:7px;padding:5px 14px;object-fit:contain;}
.logo-sub{color:rgba(255,255,255,.5);font-size:12px;}
.card{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;}
.accent{height:4px;background:linear-gradient(90deg,var(--cyan),rgba(0,167,207,.25));}
.body{padding:1.75rem 2rem 2rem;}
.title{font-size:22px;font-weight:700;color:var(--navy);}
.meta{font-size:13px;color:var(--g400);margin-top:4px;}
.progress-wrap{margin:1.25rem 0 1.5rem;}
.progress-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:5px;}
.progress-bar{height:10px;background:var(--g100);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:6px;transition:width .4s;}
.phase{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em;margin:1.4rem 0 .5rem;padding-bottom:4px;border-bottom:2px solid var(--g100);}
.phase-count{font-size:10px;color:var(--g400);font-weight:600;letter-spacing:0;text-transform:none;}
.ms{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--g200);border-radius:9px;margin-bottom:7px;background:#fff;}
.ms.done{background:#F0FFF4;border-color:#A5D6A7;}
.ms.done .ms-title{text-decoration:line-through;color:var(--g400);}
.ms-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--g200);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:all .15s;background:#fff;}
.ms-check.done{background:var(--green);border-color:var(--green);}
.ms-check.locked{cursor:default;opacity:.55;}
.ms-check:not(.locked):hover{border-color:var(--cyan);}
.ms-info{flex:1;min-width:0;}
.ms-title{font-size:14px;font-weight:500;color:var(--g800);}
.ms-sub{font-size:11px;color:var(--g400);margin-top:2px;}
.ms-owner{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.ms-status{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:var(--g600);}
.customer-summary{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 16px;}
.summary-chip{font-size:11px;padding:5px 9px;border-radius:99px;background:var(--g100);color:var(--g600);}
.ow-rep{background:rgba(36,54,70,.1);color:var(--navy);}
.ow-prospect{background:rgba(0,169,204,.12);color:#0089A6;}
.ow-joint{background:rgba(46,125,50,.1);color:var(--green);}
.overdue{color:var(--red)!important;font-weight:700;}
.footer{padding:1rem 2rem;background:var(--g100);font-size:12px;color:var(--g600);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.err-card{text-align:center;padding:3rem 2rem;}
.err-card h2{color:var(--navy);font-size:19px;margin-bottom:8px;}
.err-card p{color:var(--g400);font-size:14px;}
.hint{font-size:11px;color:var(--g400);margin-top:1.2rem;text-align:center;}

/* ── v4.0.0 polish: shared control metrics, focus ring, type ── */
html{font-size:16px;}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
input,select,textarea,button{font-family:inherit;}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(0,169,204,.18);}
:focus-visible{outline:2px solid #00A9CC;outline-offset:2px;border-radius:4px;}
h1,h2,h3{letter-spacing:-.02em;text-wrap:pretty;}
button{cursor:pointer;}
@media(max-width:600px){body{padding:.75rem .5rem}.body{padding:1.25rem 1rem}.ms{align-items:flex-start;gap:8px;padding:10px 8px}.ms-owner{max-width:92px;white-space:normal;text-align:center}.footer{padding:1rem}.logo-row{margin-left:.25rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img class="logo" src="ci-logo-negative.png" alt="Cloud Inventory" onerror="this.src='ci-logo.png'"/>
    <div class="logo-sub">Mutual Action Plan</div>
  </div>
  <div class="card">
    <div class="accent"></div>
    <div id="content" class="body">
      <div class="err-card"><p>Loading your action plan…</p></div>
    </div>
    <div class="footer" id="footer" style="display:none;">
      <span id="repInfo"></span>
      <span>Powered by Cloud Inventory</span>
    </div>
  </div>
</div>

<script>
const token = (new URLSearchParams(window.location.search).get('token')
  || (window.location.hash.match(/token=([a-f0-9]+)/) || [])[1] || '').trim();
let plan = null;

function showError(title, msg) {
  document.getElementById('content').innerHTML =
    `<div class="err-card"><h2>${title}</h2><p>${msg}</p></div>`;
}

async function load() {
  if (!token) { showError('Invalid link', 'This link is missing its access token. Ask your Cloud Inventory contact for a fresh link.'); return; }
  try {
    const res = await fetch('/api/maps/public/' + encodeURIComponent(token));
    if (res.status === 410) { showError('Link no longer active', 'This action plan link has been revoked. Ask your Cloud Inventory contact for a new one.'); return; }
    if (!res.ok) { showError('Plan not found', 'This link could not be matched to an action plan.'); return; }
    plan = await res.json();
    render();
  } catch (e) {
    showError('Connection error', 'Could not load the plan. Check your connection and refresh.');
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtDate(d, long) {
  if (!d) return '';
  const raw = String(d).split('T')[0];
  return new Date(raw + 'T12:00:00').toLocaleDateString('en-US', long
    ? {month:'long',day:'numeric',year:'numeric'} : {month:'short',day:'numeric'});
}
function isOverdue(m) {
  if (!m.dueDate || m.status === 'done') return false;
  const today = new Date();
  const local = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  return String(m.dueDate).split('T')[0] < local;
}
function planGroups(ms) {
  const saved = Array.isArray(plan.groups) ? plan.groups.filter(g => g && g.id && g.name) : [];
  if (saved.length) return saved;
  const defaults = ['Evaluate','Validate','Business Case','Legal & Procurement','Launch'];
  const names = defaults.filter(p => ms.some(m => m.phase === p));
  ms.forEach(m => { if (m.phase && !names.includes(m.phase)) names.push(m.phase); });
  return names.map((name,i) => ({id:'legacy-'+i,name}));
}

function render() {
  const ms = plan.milestones || [];
  const groups = planGroups(ms);
  const done = ms.filter(m => m.status === 'done').length;
  const pct = ms.length ? Math.round(done / ms.length * 100) : 0;
  const ownerLabels = { rep: 'Cloud Inventory', prospect: 'Your team', joint: 'Joint' };

  document.getElementById('content').innerHTML = `
    <div class="title">${esc(plan.title)}</div>
    <div class="meta">${esc(plan.company || '')}${plan.target_close_date ? ' · Target: ' + fmtDate(plan.target_close_date, true) : ''}</div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Progress</span><span>${done} of ${ms.length} complete (${pct}%)</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="customer-summary"><span class="summary-chip">${ms.filter(m=>['prospect','joint'].includes(m.owner)&&m.status!=='done').length} actions for your team</span><span class="summary-chip">${ms.filter(isOverdue).length} overdue</span></div>
    ${groups.map(g => {
      const items = ms.filter(m => m.groupId === g.id || (!m.groupId && m.phase === g.name));
      if (!items.length) return '';
      return `<div class="phase"><span>${esc(g.name)}</span><span class="phase-count">${items.filter(m=>m.status==='done').length}/${items.length} complete</span></div>
      ${items.map(m => {
        const yours = ['prospect','joint'].includes(m.owner);
        const isDone = m.status === 'done';
        const overdue = isOverdue(m);
        const statusLabel = m.status === 'in_progress' ? 'In progress' : isDone ? 'Complete' : 'Pending';
        return `<div class="ms ${isDone ? 'done' : ''}">
          <button type="button" class="ms-check ${isDone ? 'done' : ''} ${yours ? '' : 'locked'}"
               title="${yours ? 'Click to mark ' + (isDone ? 'not done' : 'done') : 'Owned by Cloud Inventory'}"
               aria-label="${yours ? 'Mark ' + esc(m.title) + ' ' + (isDone ? 'not complete' : 'complete') : esc(m.title) + ', owned by Cloud Inventory'}"
               ${yours?'':'disabled'} onclick="${yours ? `toggle('${m.id}','${isDone ? 'pending' : 'done'}')` : ''}">${isDone ? '✓' : ''}</button>
          <div class="ms-info">
            <div class="ms-title">${esc(m.title)}</div>
            <div class="ms-sub ${overdue ? 'overdue' : ''}">${m.dueDate ? 'Due ' + fmtDate(m.dueDate) + (overdue ? ' — overdue' : '') : 'No date set'}<span class="ms-status">${statusLabel}</span></div>
          </div>
          <span class="ms-owner ow-${m.owner}">${ownerLabels[m.owner] || m.owner}</span>
        </div>`;
      }).join('')}`;
    }).join('')}
    <div class="hint">Items tagged "Your team" or "Joint" can be checked off by you — updates are shared live with ${esc(plan.rep_name || 'your Cloud Inventory contact')}.</div>`;

  const f = document.getElementById('footer');
  f.style.display = 'flex';
  document.getElementById('repInfo').textContent =
    'Your contact: ' + (plan.rep_name || '') + (plan.rep_email ? ' · ' + plan.rep_email : '');
}

async function toggle(mid, status) {
  try {
    const res = await fetch('/api/maps/public/' + encodeURIComponent(token) + '/milestone/' + encodeURIComponent(mid), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    if (!res.ok) return;
    const m = (plan.milestones || []).find(x => x.id === mid);
    if (m) m.status = status;
    render();
  } catch (e) {}
}

load();
</script>
</body>
</html>
