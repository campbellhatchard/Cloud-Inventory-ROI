<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cloud Inventory — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#042C53;--navy-mid:#0A3D6B;--cyan:#00AEEF;--cyan-dark:#0090C5;
  --green:#2E7D32;--red:#C62828;--amber:#E65100;
  --gray-100:#F1F5F9;--gray-200:#E2E8F0;--gray-400:#94A3B8;
  --gray-600:#475569;--gray-800:#1E293B;--white:#fff;
  --font:'Inter',system-ui,sans-serif;--radius:10px;
}
html{font-size:15px;}
body{font-family:var(--font);background:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;}

/* Background pattern */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,174,239,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(0,174,239,.05) 0%,transparent 50%);pointer-events:none;}

/* Logo */
.logo-wrap{margin-bottom:2rem;text-align:center;}
.logo{display:block;width:min(292px,78vw);height:auto;object-fit:contain;margin:0 auto;}
.logo-sub{color:rgba(255,255,255,.45);font-size:13px;margin-top:10px;letter-spacing:.01em;}

/* Card */
.card{background:#fff;border-radius:var(--radius);width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;}
.card-accent{height:4px;background:linear-gradient(90deg,var(--cyan) 0%,rgba(0,174,239,.3) 100%);}
.card-body{padding:2rem 2rem 2.25rem;}
.card-title{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.card-sub{font-size:13px;color:var(--gray-400);margin-bottom:1.75rem;}

/* Form */
.field{margin-bottom:1.1rem;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:5px;letter-spacing:.02em;}
.field input{width:100%;padding:10px 13px;font-size:14px;font-family:var(--font);border:1.5px solid var(--gray-200);border-radius:7px;background:#fff;color:var(--gray-800);outline:none;transition:border-color .15s,box-shadow .15s;}
.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,174,239,.12);}
.field input.error{border-color:var(--red);}

/* Error banner */
.error-banner{display:none;align-items:flex-start;gap:9px;background:#FFF5F5;border:1px solid #FFCDD2;border-radius:7px;padding:10px 12px;margin-bottom:1.25rem;font-size:13px;color:var(--red);line-height:1.5;}
.error-banner.show{display:flex;}
.error-banner svg{flex-shrink:0;margin-top:1px;}

/* Lockout banner */
.lockout-banner{display:none;align-items:flex-start;gap:9px;background:#FFF3E0;border:1px solid #FFCC80;border-radius:7px;padding:10px 12px;margin-bottom:1.25rem;font-size:13px;color:var(--amber);line-height:1.5;}
.lockout-banner.show{display:flex;}

/* Submit button */
.btn-submit{width:100%;padding:11px;font-size:14px;font-weight:700;font-family:var(--font);background:var(--navy);color:#fff;border:none;border-radius:7px;cursor:pointer;transition:background .15s;margin-top:.25rem;letter-spacing:.01em;}
.btn-submit:hover:not(:disabled){background:var(--navy-mid);}
.btn-submit:disabled{background:var(--gray-400);cursor:not-allowed;}
.btn-submit.loading::after{content:' ●●●';animation:dots 1.2s infinite;}
@keyframes dots{0%,100%{opacity:.3}50%{opacity:1}}

/* Forgot password */
.forgot-wrap{text-align:center;margin-top:1.25rem;padding-top:1.1rem;border-top:1px solid var(--gray-100);}
.forgot-link{font-size:12px;color:var(--gray-400);background:none;border:none;cursor:pointer;font-family:var(--font);text-decoration:underline;padding:0;}
.forgot-link:hover{color:var(--navy);}

/* Forgot password inline form */
.forgot-form{display:none;margin-top:.75rem;}
.forgot-form.show{display:block;}
.forgot-field{display:flex;gap:8px;margin-top:.5rem;}
.forgot-input{flex:1;padding:8px 11px;font-size:13px;font-family:var(--font);border:1.5px solid var(--gray-200);border-radius:6px;outline:none;}
.forgot-input:focus{border-color:var(--cyan);}
.forgot-submit{padding:8px 14px;font-size:13px;font-weight:600;font-family:var(--font);background:var(--cyan);color:#fff;border:none;border-radius:6px;cursor:pointer;white-space:nowrap;}
.forgot-submit:hover{background:var(--cyan-dark);}
.forgot-msg{font-size:12px;color:var(--green);margin-top:6px;display:none;}
.forgot-msg.show{display:block;}

/* Footer */
.page-footer{margin-top:2rem;color:rgba(255,255,255,.2);font-size:11px;text-align:center;}
</style>
</head>
<body>

<div class="logo-wrap">
  <img class="logo" src="/ci-logo-negative.png" alt="Cloud Inventory"/>
  <div class="logo-sub">ROI Business Case Builder</div>
</div>

<div class="card">
  <div class="card-accent"></div>
  <div class="card-body">
    <div class="card-title">Sign in</div>
    <div class="card-sub">Enter your credentials to continue</div>

    <!-- Error banner -->
    <div class="error-banner" id="errorBanner">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#C62828" stroke-width="1.4"/><line x1="8" y1="4.5" x2="8" y2="8.5" stroke="#C62828" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11" r=".85" fill="#C62828"/></svg>
      <span id="errorMsg"></span>
    </div>

    <!-- Lockout banner -->
    <div class="lockout-banner" id="lockoutBanner">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 7V5a4 4 0 018 0v2" stroke="#E65100" stroke-width="1.4" stroke-linecap="round"/><rect x="2" y="7" width="12" height="8" rx="2" stroke="#E65100" stroke-width="1.4"/></svg>
      <span id="lockoutMsg"></span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" placeholder="Your username" required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••••••" required/>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Sign in</button>
    </form>

    <div class="forgot-wrap">
      <button class="forgot-link" onclick="toggleForgot()">Forgot password?</button>
      <div class="forgot-form" id="forgotForm">
        <div style="font-size:12px;color:var(--gray-400);margin-bottom:4px;">Enter your email address and we'll send a reset link.</div>
        <div class="forgot-field">
          <input type="email" class="forgot-input" id="forgotEmail" placeholder="your@email.com" autocomplete="email"/>
          <button class="forgot-submit" onclick="handleForgot()">Send link</button>
        </div>
        <div class="forgot-msg" id="forgotMsg">If that address is registered, you'll receive a reset link shortly. Check your inbox (and spam folder).</div>
      </div>
    </div>
  </div>
</div>

<div class="page-footer">Cloud Inventory &mdash; Nextworld Company &mdash; Internal tool &mdash; v2.0.3</div>

<script>
/* ── Check if already logged in ── */
(function() {
  const token = sessionStorage.getItem('ci_token');
  if (token) {
    /* Validate token is still good */
    fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(r => { if (r.ok) window.location.href = '/'; })
      .catch(() => {});
  }
})();

async function handleLogin(e) {
  e.preventDefault();
  clearErrors();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submitBtn');

  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = 'Signing in';

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      credentials: 'same-origin',
      signal: controller.signal,
      body: JSON.stringify({ username, password })
    });
    clearTimeout(timeoutId);

    const responseText = await resp.text();
    let data = {};
    try { data = responseText ? JSON.parse(responseText) : {}; }
    catch (_) {
      throw new Error(`The server returned an unexpected response (HTTP ${resp.status}).`);
    }

    if (!resp.ok) {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = 'Sign in';

      if (resp.status === 423) {
        /* Account locked */
        document.getElementById('lockoutBanner').classList.add('show');
        document.getElementById('lockoutMsg').textContent = data.error;
      } else {
        document.getElementById('errorBanner').classList.add('show');
        document.getElementById('errorMsg').textContent = data.error || 'Login failed.';
      }
      document.getElementById('password').classList.add('error');
      return;
    }

    /* Store token in sessionStorage (cleared when tab closes) */
    sessionStorage.setItem('ci_token', data.token);
    sessionStorage.setItem('ci_user', JSON.stringify(data.user));

    /* Redirect */
    if (data.user.firstLogin) {
      window.location.href = '/change-password.html?first=1';
    } else {
      window.location.href = '/';
    }

  } catch (err) {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = 'Sign in';
    document.getElementById('errorBanner').classList.add('show');
    document.getElementById('errorMsg').textContent =
      err && err.name === 'AbortError'
        ? 'The sign-in request timed out. Please try again.'
        : (err && err.message ? err.message : 'Unable to contact the sign-in service. Please try again.');
  }
}

function clearErrors() {
  document.getElementById('errorBanner').classList.remove('show');
  document.getElementById('lockoutBanner').classList.remove('show');
  document.getElementById('password').classList.remove('error');
}

function toggleForgot() {
  const form = document.getElementById('forgotForm');
  form.classList.toggle('show');
  if (form.classList.contains('show')) document.getElementById('forgotEmail').focus();
}

async function handleForgot() {
  const email = document.getElementById('forgotEmail').value.trim();
  if (!email) return;
  try {
    await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
  } catch(e) {}
  /* Always show the same message — prevent email enumeration */
  document.getElementById('forgotMsg').classList.add('show');
  document.getElementById('forgotEmail').value = '';
}

/* Clear errors on input */
document.getElementById('username').addEventListener('input', clearErrors);
document.getElementById('password').addEventListener('input', clearErrors);
</script>
</body>
</html>
