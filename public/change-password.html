<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cloud Inventory — Set new password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#042C53;--navy-mid:#0A3D6B;--cyan:#00AEEF;--cyan-dark:#0090C5;
  --green:#2E7D32;--red:#C62828;--amber:#E65100;
  --gray-100:#F1F5F9;--gray-200:#E2E8F0;--gray-400:#94A3B8;
  --gray-600:#475569;--gray-800:#1E293B;--white:#fff;
  --font:'Inter',system-ui,sans-serif;
}
html{font-size:15px;}
body{font-family:var(--font);background:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,174,239,.08) 0%,transparent 60%);pointer-events:none;}

.logo-wrap{margin-bottom:2rem;text-align:center;}
.logo{display:block;width:min(292px,78vw);height:auto;object-fit:contain;margin:0 auto;}
.logo-sub{color:rgba(255,255,255,.4);font-size:12px;margin-top:8px;}

.card{background:#fff;border-radius:10px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;}
.card-accent{height:4px;background:linear-gradient(90deg,var(--cyan) 0%,rgba(0,174,239,.3) 100%);}
.card-body{padding:2rem 2rem 2.25rem;}
.card-icon{font-size:28px;margin-bottom:.75rem;}
.card-title{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.card-sub{font-size:13px;color:var(--gray-400);margin-bottom:1.75rem;line-height:1.55;}

.field{margin-bottom:1rem;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:5px;}
.field input{width:100%;padding:10px 13px;font-size:14px;font-family:var(--font);border:1.5px solid var(--gray-200);border-radius:7px;outline:none;transition:border-color .15s,box-shadow .15s;}
.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,174,239,.12);}
.field input.valid{border-color:var(--green);}
.field input.invalid{border-color:var(--red);}

/* Password strength bar */
.strength-wrap{margin-top:6px;}
.strength-bar{height:4px;background:var(--gray-200);border-radius:2px;overflow:hidden;}
.strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;}
.strength-label{font-size:11px;margin-top:4px;font-weight:600;}

/* Requirements list */
.reqs{list-style:none;margin-top:.5rem;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;}
.req{font-size:11px;color:var(--gray-400);display:flex;align-items:center;gap:5px;}
.req::before{content:'○';flex-shrink:0;}
.req.met{color:var(--green);}.req.met::before{content:'✓';}

/* Error / success banner */
.banner{display:none;align-items:flex-start;gap:9px;border-radius:7px;padding:10px 12px;margin-bottom:1.1rem;font-size:13px;line-height:1.5;}
.banner.show{display:flex;}
.banner.err{background:#FFF5F5;border:1px solid #FFCDD2;color:var(--red);}
.banner.ok{background:#F0FFF4;border:1px solid #A5D6A7;color:var(--green);}

.btn{width:100%;padding:11px;font-size:14px;font-weight:700;font-family:var(--font);border:none;border-radius:7px;cursor:pointer;transition:background .15s;margin-top:.5rem;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--navy-mid);}
.btn-primary:disabled{background:var(--gray-400);cursor:not-allowed;}
</style>
</head>
<body>

<div class="logo-wrap">
  <img class="logo" src="/ci-logo-negative.png" alt="Cloud Inventory"/>
  <div class="logo-sub">ROI Business Case Builder</div>
</div>

<div class="card">
  <div class="card-accent"></div>
  <div class="card-body">
    <div class="card-icon" id="cardIcon">🔑</div>
    <div class="card-title" id="cardTitle">Set your password</div>
    <div class="card-sub" id="cardSub">Choose a secure password to protect your account. You only need to do this once.</div>

    <div class="banner err" id="errBanner"><span id="errMsg"></span></div>
    <div class="banner ok"  id="okBanner"><span id="okMsg"></span></div>

    <form id="pwForm" onsubmit="handleSubmit(event)">
      <div class="field" id="currentField">
        <label for="currentPw">Temporary or current password</label>
        <input type="password" id="currentPw" autocomplete="current-password" placeholder="Temporary or current password" required/>
      </div>
      <div class="field">
        <label for="newPw">New password</label>
        <input type="password" id="newPw" autocomplete="new-password" placeholder="At least 12 characters" oninput="checkStrength()"/>
        <div class="strength-wrap">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%;background:#E2E8F0;"></div></div>
          <div class="strength-label" id="strengthLabel" style="color:var(--gray-400);">Enter a password</div>
        </div>
        <ul class="reqs" id="reqList">
          <li class="req" id="req-len">12+ characters</li>
          <li class="req" id="req-upper">Uppercase letter</li>
          <li class="req" id="req-lower">Lowercase letter</li>
          <li class="req" id="req-num">Number</li>
          <li class="req" id="req-special">Special character</li>
        </ul>
      </div>
      <div class="field">
        <label for="confirmPw">Confirm new password</label>
        <input type="password" id="confirmPw" autocomplete="new-password" placeholder="Repeat your new password" oninput="checkMatch()"/>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Set password</button>
    </form>
  </div>
</div>

<div style="margin-top:1.5rem;color:rgba(255,255,255,.28);font-size:11px;">Cloud Inventory ROI Builder v2.8.1</div>

<script>
const isFirst = new URLSearchParams(window.location.search).get('first') === '1';

/* Verify we have a valid session */
const token = sessionStorage.getItem('ci_token');
if (!token) { window.location.replace('/login.html'); }

if (isFirst) {
  document.getElementById('cardTitle').textContent = 'Change your temporary password';
  document.getElementById('cardSub').textContent =
    'Enter the temporary password used to sign in, then choose a new secure password.';
} else {
  document.getElementById('cardIcon').textContent = '🔒';
  document.getElementById('cardTitle').textContent = 'Change password';
  document.getElementById('cardSub').textContent = 'Enter your current password, then choose a new one.';
}

function checkStrength() {
  const pw = document.getElementById('newPw').value;
  const checks = {
    len:     pw.length >= 12,
    upper:   /[A-Z]/.test(pw),
    lower:   /[a-z]/.test(pw),
    num:     /[0-9]/.test(pw),
    special: /[^A-Za-z0-9]/.test(pw)
  };
  Object.entries(checks).forEach(([k, met]) => {
    document.getElementById('req-'+k).classList.toggle('met', met);
  });
  const score = Object.values(checks).filter(Boolean).length;
  const fill   = document.getElementById('strengthFill');
  const label  = document.getElementById('strengthLabel');
  const pct    = (score / 5) * 100;
  const colors = ['#E2E8F0','#C62828','#E65100','#854F0B','#2E7D32','#0F6E56'];
  const labels = ['','Very weak','Weak','Fair','Strong','Very strong'];
  fill.style.width = pct + '%';
  fill.style.background = colors[score];
  label.textContent = labels[score];
  label.style.color  = colors[score];
  checkMatch();
  updateSubmit(checks);
}

function checkMatch() {
  const pw  = document.getElementById('newPw').value;
  const cpw = document.getElementById('confirmPw').value;
  const el  = document.getElementById('confirmPw');
  if (!cpw) { el.classList.remove('valid','invalid'); return; }
  el.classList.toggle('valid',   pw === cpw);
  el.classList.toggle('invalid', pw !== cpw);
}

function updateSubmit(checks) {
  const allMet = Object.values(checks).every(Boolean);
  const pw  = document.getElementById('newPw').value;
  const cpw = document.getElementById('confirmPw').value;
  document.getElementById('submitBtn').disabled = !(allMet && pw === cpw && cpw.length > 0);
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn  = document.getElementById('submitBtn');
  const err  = document.getElementById('errBanner');
  const ok   = document.getElementById('okBanner');
  err.classList.remove('show');
  ok.classList.remove('show');

  const newPw     = document.getElementById('newPw').value;
  const confirmPw = document.getElementById('confirmPw').value;
  if (newPw !== confirmPw) {
    document.getElementById('errMsg').textContent = 'Passwords do not match.';
    err.classList.add('show'); return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const currentPw = document.getElementById('currentPw').value;
  if (!currentPw) {
    document.getElementById('errMsg').textContent = 'Enter the temporary or current password.';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Set password';
    return;
  }
  const body = { currentPassword: currentPw, newPassword: newPw };

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    const resp = await fetch('/api/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      credentials: 'same-origin',
      signal: controller.signal,
      body: JSON.stringify(body)
    });
    clearTimeout(timeoutId);
    const responseText = await resp.text();
    let data = {};
    try { data = responseText ? JSON.parse(responseText) : {}; }
    catch (_) { throw new Error(`The server returned an unexpected response (HTTP ${resp.status}).`); }
    if (!resp.ok) {
      document.getElementById('errMsg').textContent = data.error || 'Failed to change password.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Set password';
      return;
    }
    /* Update cached user — no longer first login */
    try {
      const user = JSON.parse(sessionStorage.getItem('ci_user') || '{}');
      user.firstLogin = false;
      sessionStorage.setItem('ci_user', JSON.stringify(user));
    } catch(e){}
    document.getElementById('okMsg').textContent = 'Password set! Redirecting…';
    ok.classList.add('show');
    setTimeout(() => { window.location.href = '/'; }, 1200);
  } catch(err2) {
    document.getElementById('errMsg').textContent = err2 && err2.name === 'AbortError' ? 'The request timed out. Please try again.' : (err2.message || 'Network error. Please try again.');
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Set password';
  }
}

/* Also update on confirm input */
document.getElementById('confirmPw').addEventListener('input', () => {
  const pw = document.getElementById('newPw').value;
  const checks = {
    len: pw.length>=12, upper:/[A-Z]/.test(pw), lower:/[a-z]/.test(pw),
    num:/[0-9]/.test(pw), special:/[^A-Za-z0-9]/.test(pw)
  };
  updateSubmit(checks);
});
</script>
</body>
</html>
