<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cloud Inventory — Discovery Questionnaire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#1E2931;--cyan:#00A9CC;--cyan-dark:#0089A6;--cyan-pale:#E4F6FA;
  --green:#2E7D32;--green-pale:#E8F5E9;--red:#C81E10;
  --gray-50:#F8FAFC;--gray-100:#F1F5F9;--gray-200:#E3E9EE;
  --gray-400:#6B7A8D;--gray-500:#64748B;--gray-600:#475569;
  --gray-700:#334155;--gray-800:#1E293B;--white:#FFFFFF;
  --font:'Inter',system-ui,sans-serif;
  --radius:10px;--radius-sm:6px;
  --shadow:0 4px 16px rgba(0,0,0,.08);
}
html{font-size:15px;scroll-behavior:smooth;}
body{font-family:var(--font);background:#F0F4F8;color:var(--gray-800);min-height:100vh;}

/* Header */
.header{background:var(--navy);padding:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.header-inner{max-width:760px;margin:0 auto;padding:.85rem 1.5rem;display:flex;align-items:center;gap:14px;}
.header-logo{height:32px;object-fit:contain;}
.header-divider{width:1px;height:20px;background:rgba(255,255,255,.2);}
.header-title{color:rgba(255,255,255,.7);font-size:13px;font-weight:500;}
.header-accent{height:3px;background:linear-gradient(90deg,var(--cyan) 0%,rgba(0,174,239,.2) 100%);}

/* Progress bar */
.progress-wrap{background:var(--navy);padding:.5rem 1.5rem .75rem;}
.progress-inner{max-width:760px;margin:0 auto;}
.progress-label{color:rgba(255,255,255,.5);font-size:11px;margin-bottom:5px;}
.progress-bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--cyan);border-radius:2px;transition:width .4s;}

/* Main */
.main{max-width:760px;margin:0 auto;padding:2rem 1.5rem 4rem;}

/* Welcome card */
.welcome-card{background:var(--white);border-radius:var(--radius);padding:2rem;margin-bottom:2rem;box-shadow:var(--shadow);}
.welcome-co{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.welcome-sub{font-size:14px;color:var(--gray-500);line-height:1.6;margin-bottom:1rem;}
.welcome-privacy{display:flex;align-items:flex-start;gap:10px;background:var(--green-pale);border:1px solid #A5D6A7;border-radius:var(--radius-sm);padding:.85rem 1rem;font-size:13px;color:var(--green);}
.welcome-privacy-icon{font-size:18px;flex-shrink:0;}

/* Section card */
.section-card{background:var(--white);border-radius:var(--radius);margin-bottom:1.25rem;box-shadow:var(--shadow);overflow:hidden;}
.section-header{background:var(--navy);padding:.9rem 1.25rem;display:flex;align-items:center;gap:10px;}
.section-icon{font-size:18px;}
.section-title-text{font-size:14px;font-weight:700;color:#fff;}
.section-count{margin-left:auto;font-size:11px;color:rgba(255,255,255,.4);background:rgba(255,255,255,.1);padding:2px 8px;border-radius:10px;}
.section-body{padding:0;}

/* Question */
.question{padding:1.1rem 1.25rem;border-bottom:1px solid var(--gray-100);}
.question:last-child{border-bottom:none;}
.question.answered{background:#FAFFFE;}
.q-text{font-size:14px;font-weight:500;color:var(--gray-800);margin-bottom:5px;line-height:1.45;}
/* ── Collapsible "Why are we asking?" ── */
.q-why{margin:5px 0 8px;}
.q-why-toggle{font-size:11.5px;color:var(--cyan,#00A9CC);cursor:pointer;list-style:none;font-weight:600;}
.q-why-toggle::-webkit-details-marker{display:none;}
.q-context{font-size:12.5px;color:var(--gray-500,#64748B);line-height:1.5;margin:6px 0 0;padding-left:10px;border-left:2px solid var(--cyan-line,#B4E3EF);}
.q-placeholder-hint{font-size:12px;color:var(--gray-400);margin-bottom:10px;}
.q-input{width:100%;padding:10px 14px;font-size:14px;font-family:var(--font);border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);background:var(--white);color:var(--gray-800);transition:border-color .15s,box-shadow .15s;outline:none;}
.q-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,174,239,.12);}
.q-input.has-answer{border-color:#A5D6A7;background:var(--green-pale);}
.q-input::placeholder{color:var(--gray-300);}
.q-answered-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--green);margin-top:6px;}

/* Optional label */
.q-optional{font-size:11px;color:var(--gray-400);margin-left:6px;font-weight:400;}

/* Save bar */
.save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--gray-200);padding:.85rem 1.5rem;display:flex;align-items:center;gap:12px;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.08);}
.save-bar-inner{max-width:760px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;}
.save-status{flex:1;font-size:13px;color:var(--gray-500);}
.save-status.saved{color:var(--green);}
.save-btn{padding:10px 24px;font-size:14px;font-weight:700;border-radius:var(--radius-sm);cursor:pointer;border:none;font-family:var(--font);background:var(--cyan);color:#fff;transition:background .15s;}
.save-btn:hover{background:var(--cyan-dark);}
.save-btn:disabled{background:var(--gray-300);cursor:not-allowed;}

/* Complete state */
.complete-card{background:var(--white);border-radius:var(--radius);padding:2.5rem;text-align:center;box-shadow:var(--shadow);margin-top:1rem;}
.complete-icon{font-size:48px;margin-bottom:1rem;}
.complete-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.complete-sub{font-size:14px;color:var(--gray-500);line-height:1.6;max-width:480px;margin:0 auto;}

/* Error state */
.error-card{background:var(--white);border-radius:var(--radius);padding:2.5rem;text-align:center;box-shadow:var(--shadow);}
.error-icon{font-size:40px;margin-bottom:1rem;}
.error-title{font-size:20px;font-weight:700;color:var(--red);margin-bottom:8px;}
.error-sub{font-size:14px;color:var(--gray-500);line-height:1.6;}

/* Toast */
.toast{position:fixed;top:80px;right:20px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transform:translateY(-10px);transition:opacity .25s,transform .25s;z-index:999;pointer-events:none;border-left:4px solid var(--cyan);}
.toast.show{opacity:1;transform:translateY(0);}

/* Mobile */
@media(max-width:580px){
  .main{padding:1.25rem 1rem 5rem;}
  .section-header{padding:.75rem 1rem;}
  .question{padding:.9rem 1rem;}
  .welcome-card{padding:1.5rem 1rem;}
}

.autosave{font-size:11px;margin-top:6px;display:inline-flex;align-items:center;gap:5px;}
.autosave.saving{color:rgba(255,255,255,.6);}
.autosave.saved{color:#7FD99F;}
.autosave.error{color:#FFB4A8;}
.autosave .as-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:as-pulse 1s infinite;}
@keyframes as-pulse{0%,100%{opacity:.4}50%{opacity:1}}
.resume-cue{background:#E4F6FA;border:1px solid var(--cyan);border-radius:var(--radius-sm);padding:.85rem 1rem;font-size:14px;color:var(--navy);margin-bottom:1.25rem;}

/* ── v4.0.0 polish: shared control metrics, focus ring, type ── */
html{font-size:16px;}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
input,select,textarea,button{font-family:inherit;}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(0,169,204,.18);}
:focus-visible{outline:2px solid #00A9CC;outline-offset:2px;border-radius:4px;}
h1,h2,h3{letter-spacing:-.02em;text-wrap:pretty;}
button{cursor:pointer;}
/* ── Progress header top row ── */
.ph-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.ph-meta{font-size:11px;color:rgba(255,255,255,.62);}

/* ── Section navigator pills ── */
.sec-nav{display:flex;gap:5px;flex-wrap:wrap;padding:10px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.sec-nav::-webkit-scrollbar{display:none;}
.sn-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1.5px solid rgba(255,255,255,.18);border-radius:20px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;}
.sn-pill:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff;}
.sn-pill.sn-active{background:var(--cyan,#00A9CC);border-color:var(--cyan,#00A9CC);color:#fff;}
.sn-pill.sn-done{background:rgba(74,222,128,.18);border-color:rgba(74,222,128,.4);color:rgba(255,255,255,.9);}
.sn-pill.sn-part{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;}
.sn-mark{font-size:11px;min-width:14px;text-align:center;}
.sn-label{max-width:120px;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:600px){.sn-label{max-width:80px;}}

/* ── Section card (the active section) ── */
.sec-card{background:var(--white,#fff);border-radius:var(--radius,12px);box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px;}
.sec-card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--gray-100,#F1F5F8);background:var(--gray-50,#F7F9FB);}
.sec-card-icon{font-size:20px;flex-shrink:0;}
.sec-card-meta{flex:1;min-width:0;}
.sec-card-title{font-size:15px;font-weight:700;color:var(--navy,#1E2931);}
.sec-card-count{font-size:12px;color:var(--gray-500,#6B7A8D);margin-top:2px;}
.sec-body{padding:20px;}

/* ── Back / Next navigation buttons ── */
.sec-nav-btns{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;}
.snb-back{background:none;border:1.5px solid var(--gray-200,#E2E8F0);color:var(--gray-600,#4A5A6A);font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer;transition:all .15s;}
.snb-back:hover{border-color:var(--cyan,#00A9CC);color:var(--cyan,#00A9CC);}
.snb-next{background:var(--cyan,#00A9CC);color:#fff;border:none;font-family:inherit;font-size:13.5px;font-weight:700;padding:10px 24px;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,169,204,.28);transition:all .15s;}
.snb-next:hover{background:var(--cyan-dark,#0089A6);transform:translateY(-1px);}
.snb-submit{font-size:13.5px;padding:10px 24px !important;}

/* ── "What your answers help assess" panel ── */
.value-panel:empty{display:none;}
.value-panel{background:var(--white,#fff);border-radius:var(--radius,12px);box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.08));padding:1.25rem 1.4rem;margin-bottom:1rem;}
.vp-title{font-size:14px;font-weight:700;color:var(--navy,#1E2931);}
.vp-sub{font-size:12px;color:var(--gray-500,#6B7A8D);margin-top:3px;line-height:1.5;}
.vd-list{list-style:none;margin:1rem 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.vd-row{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:9px;background:#F7F9FB;border:1px solid transparent;}
.vd-row.vd-done{background:#F2FBF6;border-color:#CDEBD9;}
.vd-row.vd-part{background:#F5FAFD;border-color:#D3E7F2;}
.vd-mark{flex-shrink:0;width:17px;text-align:center;font-size:12px;line-height:1.5;color:var(--gray-500,#6B7A8D);}
.vd-done .vd-mark{color:#2E7D32;font-weight:700;}
.vd-part .vd-mark{color:#0089A6;}
.vd-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.vd-label{font-size:12.5px;font-weight:600;color:var(--navy,#1E2931);}
.vd-blurb{font-size:11.5px;color:var(--gray-500,#6B7A8D);line-height:1.45;}
.vd-status{flex-shrink:0;font-size:10.5px;font-weight:600;color:var(--gray-500,#6B7A8D);white-space:nowrap;padding-top:2px;}
.vd-done .vd-status{color:#2E7D32;}
.vd-part .vd-status{color:#0089A6;}
@media(max-width:560px){
  .vd-row{flex-wrap:wrap;}
  .vd-status{width:100%;padding-left:27px;padding-top:1px;}
}

/* ── Per-question value context + "not sure" ── */
.q-helps{font-size:11px;color:var(--gray-500,#6B7A8D);margin-top:7px;}
.q-helps strong{color:var(--navy,#1E2931);font-weight:600;}
.q-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap;}
.q-unsure{background:none;border:1px solid var(--gray-200,#E2E8F0);color:var(--gray-500,#6B7A8D);font-family:inherit;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;cursor:pointer;transition:all .15s;}
.q-unsure:hover{border-color:var(--cyan,#00A9CC);color:var(--cyan,#00A9CC);}
.q-unsure.is-on{background:#FFF7E8;border-color:#E6C378;color:#8A6410;}
.question.unsure{background:#FFFCF5;}
/* ── Percent questions: slider + precise box ── */
.q-pct{display:flex;align-items:center;gap:14px;margin-top:2px;}
.q-range{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--gray-200,#E2E8F0);outline:none;cursor:pointer;}
.q-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;background:var(--cyan,#00A9CC);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer;}
.q-range::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--cyan,#00A9CC);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer;}
.q-range:focus-visible{box-shadow:0 0 0 3px rgba(0,169,204,.25);}
.q-pct-box{position:relative;flex-shrink:0;width:88px;}
.q-input-sm{width:100%;padding-right:26px !important;text-align:right;}
.q-affix{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--gray-500,#6B7A8D);pointer-events:none;}
@media(max-width:560px){
  .q-pct{gap:10px;}
  .q-pct-box{width:74px;}
}
/* ── Review & confirm screen ── */
.rv-head{background:var(--white,#fff);border-radius:var(--radius,12px);box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.08));padding:1.5rem 1.6rem;margin-bottom:1rem;}
.rv-title{font-size:19px;font-weight:700;color:var(--navy,#1E2931);}
.rv-sub{font-size:13px;color:var(--gray-500,#6B7A8D);line-height:1.6;margin-top:6px;}
.rv-actions,.rv-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:1rem;}
.rv-foot{background:var(--white,#fff);border-radius:var(--radius,12px);box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.08));padding:1.25rem 1.6rem;margin-top:1rem;}
.rv-back{background:none;border:1px solid var(--gray-200,#E2E8F0);color:var(--navy,#1E2931);font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;}
.rv-back:hover{border-color:var(--cyan,#00A9CC);color:var(--cyan,#00A9CC);}
.rv-sec{background:var(--white,#fff);border-radius:var(--radius,12px);box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.08));padding:1.1rem 1.4rem;margin-bottom:.75rem;}
.rv-sec-title{font-size:13px;font-weight:700;color:var(--navy,#1E2931);margin-bottom:.6rem;}
.rv-list{list-style:none;margin:0;padding:0;}
.rv-row{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--gray-100,#F1F5F8);}
.rv-row:first-child{border-top:none;}
.rv-q{flex:1;min-width:0;font-size:12.5px;color:var(--gray-600,#4A5A6A);line-height:1.5;}
.rv-a{flex-shrink:0;max-width:38%;font-size:13px;font-weight:700;color:var(--navy,#1E2931);text-align:right;overflow-wrap:anywhere;}
.rv-unsure{color:#8A6410;font-weight:600;}
.rv-blank{color:var(--gray-400,#6B7A8D);font-weight:500;font-style:italic;}
.rv-edit{flex-shrink:0;background:none;border:none;color:var(--cyan,#00A9CC);font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 4px;text-decoration:underline;}
.question.rv-flash{box-shadow:0 0 0 3px rgba(0,169,204,.35);border-radius:8px;transition:box-shadow .3s;}
@media(max-width:560px){
  .rv-row{flex-wrap:wrap;gap:4px;}
  .rv-a{max-width:100%;text-align:left;}
}
.p-to-top{position:fixed;bottom:22px;right:22px;width:46px;height:46px;border-radius:50%;border:1px solid var(--gray-200,#E2E8F0);background:#fff;color:var(--navy,#1E2931);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:95;box-shadow:0 4px 16px rgba(0,0,0,.16);transition:opacity .2s,transform .2s,visibility .2s;}
.p-to-top:hover{transform:translateY(-2px);background:var(--cyan,#00A9CC);color:#fff;border-color:var(--cyan,#00A9CC);}
.p-to-top-hidden{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px);}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <img class="header-logo" src="ci-logo-negative.png" alt="Cloud Inventory" onerror="this.style.display='none'"/>
    <div class="header-divider"></div>
    <span class="header-title" id="headerTitle">Discovery Questionnaire</span>
  </div>
  <div class="header-accent"></div>
</div>

<div class="progress-wrap">
  <div class="progress-inner">
    <div class="ph-top">
      <div class="progress-label" id="progressLabel">Loading…</div>
      <div class="ph-meta" id="progressMeta"></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="sec-nav" id="secNav"></div>
    <div class="autosave" id="autosaveIndicator" style="display:none;"></div>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="error-card">
    <div class="error-icon">⏳</div>
    <div class="error-title">Loading your questionnaire…</div>
    <div class="error-sub">Please wait a moment.</div>
  </div>
</div>

<div class="save-bar">
  <div class="save-bar-inner">
    <span class="save-status" id="saveStatus">Enter your answers below.</span>
    <button class="save-btn" id="saveBtn" onclick="submitAnswers()" disabled>Submit answers</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="discovery.js"></script>
<script>
/* ════════════════════════════════════════
   PROSPECT VIEW — discovery.js questions
   NO financial data, NO ROI results
   ════════════════════════════════════════ */

// Strip discovery.js of any imports it expects that aren't on this page
// (it's designed to work standalone for the prospect view)

let sessionData = null;
let prospectAnswers = {};
let totalQuestions = 0;
let answeredCount = 0;
let autoSaveTimer = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

async function init() {
  /* Prefer ?token= (survives email/chat link-rewriting); fall back to the
     legacy #token= hash so links shared before this change still work. */
  let token = '';
  try {
    const params = new URLSearchParams(window.location.search);
    token = (params.get('token') || '').trim();
  } catch (e) { /* ignore */ }
  if (!token && window.location.hash.startsWith('#token=')) {
    token = window.location.hash.replace('#token=', '').split('&')[0].trim();
  }
  token = decodeURIComponent(token || '').trim();

  if (!token) {
    showError('Invalid link', 'This link is missing a valid session token. Please ask your Cloud Inventory contact for a new link.');
    return;
  }
  if (!/^[a-f0-9]{64}$/i.test(token)) {
    showError('Invalid link', 'The questionnaire link appears incomplete or changed. Please request a new link.');
    return;
  }

  try {
    const res = await fetch('/api/discovery/sessions/' + encodeURIComponent(token), {
      method: 'GET',
      cache: 'no-store',
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      console.warn('Discovery link failed', { status: res.status, error: err.error || null, code: err.code || null });

      if (res.status === 400) {
        showError('Invalid link', 'The questionnaire link appears incomplete or changed. Please request a new link.');
      } else if (res.status === 401 || res.status === 403) {
        showError('Access configuration error', 'This questionnaire is currently being blocked by access controls. Please contact Cloud Inventory for a corrected link.');
      } else if (res.status === 404) {
        showError('Link not found', 'This questionnaire could not be found. Please request a new link.');
      } else if (res.status === 410) {
        showError('Link no longer active', err.error || 'This link has expired or been revoked. Please request a new link.');
      } else if (res.status === 429) {
        showError('Temporarily unavailable', 'Too many requests were received from your network. Please wait a minute and try again.');
      } else {
        showError('Service temporarily unavailable', 'The questionnaire could not be loaded. Please refresh or try again shortly.');
      }
      return;
    }
    const data = await res.json();
    sessionData = { token, industry: data.industry || 'default', company: data.company || '' };

    /* Restore any answers the prospect (or rep) already entered */
    prospectAnswers = {};
    (data.answers || []).forEach(a => {
      if (a.questionId) {
        prospectAnswers[a.questionId]          = a.answer    || '';
        prospectAnswers[a.questionId + '_by']  = a.enteredBy || 'prospect';
      }
    });

    renderQuestionnaire();
  } catch(e) {
    console.error('init error:', e.message);
    showError('Connection error', 'Could not load your questionnaire. Check your internet connection and try refreshing the page.');
  }
}

function getQueryParam(name) {
  /* Check the real query string first, then any hash-encoded params. */
  const q = new URLSearchParams(window.location.search).get(name);
  if (q) return q;
  const hash = window.location.hash.replace(/^#/, '');
  return new URLSearchParams(hash).get(name) || '';
}

function showError(title, msg) {
  document.getElementById('mainContent').innerHTML = `
    <div class="error-card">
      <div class="error-icon">🔗</div>
      <div class="error-title">${title}</div>
      <div class="error-sub">${msg}</div>
    </div>`;
  document.getElementById('progressLabel').textContent = 'Link error';
}

/* ── Section-at-a-time layout (replaces single-scroll) ──────────────
   One section visible at a time. The section navigator shows all
   sections with completion status; the prospect can jump freely.     */
var _currentSectionIdx = 0;

function renderQuestionnaire(targetSection) {
  var industry = sessionData.industry || 'default';
  var company  = sessionData.company  || 'your organisation';
  var sections = getProspectQuestions(industry, { hasFieldInventory: sessionData && !!sessionData.has_field_inventory });
  totalQuestions = sections.reduce(function(s, sec){ return s + sec.questions.length; }, 0);
  answeredCount  = Object.keys(prospectAnswers)
    .filter(function(k){ return !k.endsWith('_by') && isRealAnswer(prospectAnswers[k]); }).length;
  document.getElementById('headerTitle').textContent =
    'Discovery Questionnaire' + (company ? ' \u2014 ' + company : '');
  updateProgress();
  renderSecNav(sections);
  showSection(sections, targetSection != null ? targetSection : _currentSectionIdx);
}

function renderSecNav(sections) {
  var nav = document.getElementById('secNav');
  if (!nav) return;
  nav.innerHTML = sections.map(function(sec, i) {
    var answered = sec.questions.filter(function(q){ return isRealAnswer(prospectAnswers[q.id]); }).length;
    var total    = sec.questions.length;
    var done     = answered === total && total > 0;
    var started  = answered > 0 && !done;
    var cls      = done ? 'sn-done' : started ? 'sn-part' : '';
    var mark     = done ? '\u2713' : started ? '\u25cf' : String(i + 1);
    return '<button class="sn-pill ' + cls + (i === _currentSectionIdx ? ' sn-active' : '') + '"'
      + ' onclick="jumpToSection(' + i + ')" title="' + escapeHtml(sec.section) + '">'
      + '<span class="sn-mark">' + mark + '</span>'
      + '<span class="sn-label">' + escapeHtml(sec.section) + '</span>'
      + '</button>';
  }).join('');
}

function jumpToSection(idx) {
  var sections = getProspectQuestions(sessionData.industry || 'default', { hasFieldInventory: sessionData && !!sessionData.has_field_inventory });
  _currentSectionIdx = Math.max(0, Math.min(idx, sections.length - 1));
  showSection(sections, _currentSectionIdx);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showSection(sections, idx) {
  _currentSectionIdx = idx;
  var sec     = sections[idx];
  var isLast  = idx === sections.length - 1;
  var isFirst = idx === 0;
  var answered = sec.questions.filter(function(q){ return isRealAnswer(prospectAnswers[q.id]); }).length;
  var resumeCue = (answeredCount > 0 && isFirst)
    ? '<div class="resume-cue"><strong>Welcome back!</strong> We\u2019ve kept your ' + answeredCount
      + ' previous answer' + (answeredCount !== 1 ? 's' : '') + ' \u2014 pick up where you left off.</div>'
    : '';
  var questions = sec.questions.map(function(q){ return renderProspectQuestion(q); }).join('');
  document.getElementById('mainContent').innerHTML =
    (isFirst ? resumeCue + renderWelcomeCard() : '')
    + '<div class="sec-card" id="sec-card-' + idx + '">'
    + '<div class="sec-card-head">'
    + '<span class="sec-card-icon">' + getSectionIcon(sec.section) + '</span>'
    + '<div class="sec-card-meta">'
    + '<div class="sec-card-title">' + escapeHtml(sec.section) + '</div>'
    + '<div class="sec-card-count" id="sectionCount">' + answered + ' of ' + sec.questions.length + ' answered</div>'
    + '</div></div>'
    + '<div class="sec-body">' + questions + '</div>'
    + '</div>'
    + '<div class="sec-nav-btns">'
    + (!isFirst
        ? '<button class="snb-back" onclick="jumpToSection(' + (idx - 1) + ')">&#8592; Back</button>'
        : '<span></span>')
    + (isLast
        ? '<button class="save-btn snb-submit" onclick="submitAnswers()">Review &amp; submit</button>'
        : '<button class="snb-next" onclick="jumpToSection(' + (idx + 1) + ')">Next &#8594;</button>')
    + '</div>'
    + '<div style="height:60px;"></div>';
  renderSecNav(sections);
  updateSaveButton();
  /* Re-observe question wraps for the prospect assistant's field-sensitive
     context — must run after innerHTML is set since elements are new. */
  if (typeof window._passtReObserve === 'function') window._passtReObserve();
}

function renderWelcomeCard() {
  var company = sessionData.company || 'your organisation';
  var label   = getIndustryLabel(sessionData.industry || 'default');
  return '<div class="welcome-card">'
    + '<div class="welcome-co">Welcome' + (company ? ', ' + escapeHtml(company) : '') + '</div>'
    + '<div class="welcome-sub">Thank you for completing this questionnaire. Your answers help Cloud Inventory build a relevant business case for your '
    + escapeHtml(label) + ' operations.<br/><br/>'
    + 'Use the section tabs above to navigate. You can jump to any section at any time \u2014 answers save automatically as you type.</div>'
    + '<div class="welcome-privacy"><span class="welcome-privacy-icon">&#128274;</span>'
    + '<span><strong>Your data stays private.</strong> Responses are shared only with your Cloud Inventory contact.</span></div>'
    + '</div>';
}

function renderProspectQuestion(q) {
  const answer = prospectAnswers[q.id] || '';
  const isAnswered = isRealAnswer(answer);
  if (q.type === 'context') {
    return `
      <div class="question ${isAnswered?'answered':''}" id="wrap-${q.id}">
        <div class="q-text">${q.text}</div>
        <textarea
          class="q-input ${isAnswered?'has-answer':''}"
          id="pq-${q.id}"
          rows="3"
          placeholder="Share your thoughts…"
          oninput="handleAnswer('${q.id}', this.value)"
          onfocus="this.parentElement.style.background='#FAFFFE'"
          onblur="this.parentElement.style.background=''"
        >${escapeHtml(answer)}</textarea>
        ${isAnswered ? `<div class="q-answered-badge">✓ Answered</div>` : ''}
      </div>`;
  }
  var drv = driverForQuestion(q);
  var ctxText = contextForQuestion(q);
  var context = ctxText
    ? '<details class="q-why"><summary class="q-why-toggle">Why are we asking?</summary><div class="q-context">' + escapeHtml(ctxText) + '</div></details>'
    : '';
  var helps = drv
    ? '<div class="q-helps">Helps assess: <strong>' + escapeHtml(VALUE_DRIVERS[drv].label) + '</strong></div>'
    : '';
  const unsure = (answer || '').trim().toLowerCase() === NOT_SURE_TOKEN;
  const shown = unsure ? '' : answer;

  /* Percent questions get a slider paired with a numeric box: the slider makes
     the value tangible, the box keeps it precise. Number questions get live
     thousands separators for legibility. Values are always STORED raw. */
  let control;
  if (q.type === 'percent') {
    const nv = parseFloat(String(shown).replace(/[^0-9.]/g, ''));
    const val = isFinite(nv) ? Math.max(0, Math.min(100, nv)) : '';
    control = `
      <div class="q-pct">
        <input type="range" class="q-range" id="rg-${q.id}" min="0" max="100" step="1"
          value="${val === '' ? 0 : val}" aria-label="${escapeHtml(q.text)}"
          oninput="handlePctSlider('${q.id}', this.value)" />
        <div class="q-pct-box">
          <input type="text" inputmode="decimal" class="q-input q-input-sm ${isAnswered?'has-answer':''}"
            id="pq-${q.id}" value="${escapeHtml(String(val))}" placeholder="—"
            oninput="handlePctBox('${q.id}', this.value)" />
          <span class="q-affix">%</span>
        </div>
      </div>`;
  } else if (q.type === 'number') {
    control = `
      <input type="text" inputmode="decimal" class="q-input ${isAnswered?'has-answer':''}"
        id="pq-${q.id}" value="${escapeHtml(formatNumDisplay(shown))}" placeholder="Your answer…"
        oninput="handleNumAnswer('${q.id}', this.value)"
        onfocus="this.parentElement.style.background='#FAFFFE'"
        onblur="this.parentElement.style.background=''; this.value=formatNumDisplay(this.value);" />`;
  } else {
    control = `
      <input type="text" class="q-input ${isAnswered?'has-answer':''}" id="pq-${q.id}"
        value="${escapeHtml(shown)}" placeholder="Your answer…"
        oninput="handleAnswer('${q.id}', this.value)"
        onfocus="this.parentElement.style.background='#FAFFFE'"
        onblur="this.parentElement.style.background=''" />`;
  }

  return `
    <div class="question ${isAnswered?'answered':''} ${unsure?'unsure':''}" id="wrap-${q.id}">
      <div class="q-text">${q.text}</div>
      ${context}
      <div class="q-placeholder-hint">e.g. ${q.placeholder}</div>
      ${control}
      ${helps}
      <div class="q-foot">
        <button type="button" class="q-unsure ${unsure?'is-on':''}" onclick="toggleNotSure('${q.id}')">
          ${unsure ? '&#10003; Marked \u201cnot sure\u201d' : 'I\u2019m not sure'}
        </button>
        <span class="q-badge-slot">${isAnswered && !unsure ? '<span class="q-answered-badge">&#10003; Answered</span>' : ''}</span>
      </div>
    </div>`;
}

/* Display-only thousands separators. Stored values stay raw so the rep-side
   sync and ROI model never see formatting characters. */
function formatNumDisplay(v) {
  const raw = String(v == null ? '' : v).replace(/,/g, '').trim();
  if (raw === '' || raw.toLowerCase() === NOT_SURE_TOKEN) return '';
  const n = Number(raw);
  if (!isFinite(n)) return raw;
  const dec = raw.includes('.') ? raw.split('.')[1].length : 0;
  if (Math.abs(n) < 1000) return raw;              // leave small values (e.g. 3.50) alone
  return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: Math.max(dec, 0) });
}
function stripNum(v) { return String(v == null ? '' : v).replace(/,/g, '').trim(); }

/* Number field: store raw, keep the caret usable while typing. */
function handleNumAnswer(id, value) {
  handleAnswer(id, stripNum(value));
}

/* Percent slider ↔ box, kept in sync; both store the raw number. */
function handlePctSlider(id, value) {
  const box = document.getElementById('pq-' + id);
  if (box) box.value = value;
  handleAnswer(id, String(value));
}
function handlePctBox(id, value) {
  const raw = stripNum(value);
  const n = parseFloat(raw.replace(/[^0-9.]/g, ''));
  const rg = document.getElementById('rg-' + id);
  if (rg && isFinite(n)) rg.value = Math.max(0, Math.min(100, n));
  handleAnswer(id, raw);
}

/* "I'm not sure" records the gap for the rep instead of leaving a blank the
   prospect feels stuck on. It is stored but not counted as data. */
function toggleNotSure(id) {
  const cur = (prospectAnswers[id] || '').trim().toLowerCase();
  const turningOn = cur !== NOT_SURE_TOKEN;
  const val = turningOn ? NOT_SURE_TOKEN : '';
  prospectAnswers[id] = val;
  prospectAnswers[id + '_by'] = val ? 'prospect' : '';
  const input = document.getElementById('pq-' + id);
  if (input) { input.value = ''; input.classList.remove('has-answer'); }
  const rg = document.getElementById('rg-' + id);
  if (rg && turningOn) rg.value = 0;
  const wrap = document.getElementById('wrap-' + id);
  if (wrap) {
    wrap.classList.toggle('unsure', turningOn);
    wrap.classList.remove('answered');
    const btn = wrap.querySelector('.q-unsure');
    if (btn) {
      btn.classList.toggle('is-on', turningOn);
      btn.innerHTML = turningOn ? '&#10003; Marked \u201cnot sure\u201d' : 'I\u2019m not sure';
    }
    const slot = wrap.querySelector('.q-badge-slot');
    if (slot) slot.innerHTML = '';
  }
  updateSectionCounts();
  updateProgress();
  updateSaveButton();
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => pushAnswer(id, val, 'prospect'), 400);
}

function handleAnswer(id, value) {
  prospectAnswers[id] = value;
  prospectAnswers[id + '_by'] = value ? 'prospect' : '';

  const real  = isRealAnswer(value);
  const input = document.getElementById('pq-' + id);
  const wrap  = document.getElementById('wrap-' + id);
  if (input) input.classList.toggle('has-answer', real);
  if (wrap) {
    wrap.classList.toggle('answered', real);
    /* Typing a real answer supersedes a previous "not sure". */
    if (real && wrap.classList.contains('unsure')) {
      wrap.classList.remove('unsure');
      const btn = wrap.querySelector('.q-unsure');
      if (btn) { btn.classList.remove('is-on'); btn.innerHTML = 'I\u2019m not sure'; }
    }
    /* Badge lives in .q-badge-slot on standard questions; context questions
       (textarea) have no footer, so fall back to appending to the wrapper. */
    const slot = wrap.querySelector('.q-badge-slot');
    if (slot) {
      slot.innerHTML = real ? '<span class="q-answered-badge">&#10003; Answered</span>' : '';
    } else {
      const badge = wrap.querySelector('.q-answered-badge');
      if (real && !badge) {
        const b = document.createElement('div');
        b.className = 'q-answered-badge';
        b.innerHTML = '&#10003; Answered';
        wrap.appendChild(b);
      } else if (!real && badge) {
        badge.remove();
      }
    }
  }

  // Update section count
  updateSectionCounts();
  updateProgress();
  updateSaveButton();

  /* Push this specific answer to DB immediately (debounced 800ms) */
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => pushAnswer(id, value, 'prospect'), 800);
}

function updateSectionCounts() {
  /* In the tabbed layout only one section is shown at a time.
     Update just the count badge for the currently visible section. */
  var el = document.getElementById('sectionCount');
  if (!el) return;
  var sections = getProspectQuestions(sessionData && sessionData.industry || 'default', { hasFieldInventory: sessionData && !!sessionData.has_field_inventory });
  var sec = sections[_currentSectionIdx];
  if (!sec) return;
  var answered = sec.questions.filter(function(q){ return isRealAnswer(prospectAnswers[q.id]); }).length;
  el.textContent = answered + ' of ' + sec.questions.length + ' answered';
  /* Also refresh the navigator pills to show updated completion dots */
  renderSecNav(sections);
}

/* ═══════════════════════════════════════════════════════════════════
   VALUE DRIVERS — what the prospect's answers make it possible to assess.

   Note on language: each question carries an internal `why` field written
   for Cloud Inventory reps ("Count-labor lever", "Direct input for write-off
   savings calculation"). That is deliberately NOT shown here — it is internal
   modelling language. The copy below is written for the customer, describing
   what the answers help THEM understand about their own operation.

   Keys are the question `sync` targets, so this mapping stays in step with
   the questions themselves.
   ═══════════════════════════════════════════════════════════════════ */
const VALUE_DRIVERS = {
  labour: {
    label: 'Team time & productivity',
    blurb: 'How much of your team\u2019s day goes to manual counting, data entry, and chasing discrepancies.',
    fields: ['userCount','laborWastePct','countDaysYr','countPeople','fieldTechs',
             'addedJobsPerDay','pickRateGainPct','repeatVisitsYr','costPerTruckRoll','costPerOrder']
  },
  accuracy: {
    label: 'Inventory accuracy & losses',
    blurb: 'The gap between recorded and actual stock, and what it costs in write-offs and shrinkage.',
    fields: ['currentAccuracy','annualWriteOff','fieldLeakagePct']
  },
  workingCapital: {
    label: 'Working capital tied up',
    blurb: 'How much cash sits in inventory, and how quickly it turns.',
    fields: ['inventoryValue','invTurnsCurrent','fieldInventoryValue']
  },
  service: {
    label: 'Delivery & customer commitments',
    blurb: 'Order accuracy and on-time-in-full performance, and the revenue exposed when they slip.',
    fields: ['otifBaseline','otifTarget','orderErrorPct','costPerError','ordersPerYr','revenue','revenuePerJob']
  },
  uptime: {
    label: 'Downtime & expediting',
    blurb: 'Production or service interruptions caused by parts not being where the record says.',
    fields: ['downtimeEventsYr','downtimeHrsPerEvent','downtimeCostPerHr','expediteSpendYr']
  },
  systems: {
    label: 'Systems & support cost',
    blurb: 'What you spend maintaining the current tools and workarounds.',
    fields: ['itCost']
  },
  finance: {
    label: 'Your financial yardstick',
    blurb: 'The hurdle rate your finance team uses, so any case is judged on your own terms.',
    fields: ['discRate']
  }
};

/* sync field → driver key (built once) */
const FIELD_TO_DRIVER = (() => {
  const m = {};
  Object.keys(VALUE_DRIVERS).forEach(k => VALUE_DRIVERS[k].fields.forEach(f => { m[f] = k; }));
  return m;
})();

function driverForQuestion(q) {
  return (q && q.sync && FIELD_TO_DRIVER[q.sync]) ? FIELD_TO_DRIVER[q.sync] : null;
}

/* Plain-language "why we ask" context, keyed by the value each question feeds
   (its sync target). Written for the customer — what the number tells us about
   their operation — not internal modelling language. Keyed by sync so it
   applies across industries without editing every question. */
const QUESTION_CONTEXT = {
  userCount:        'This sizes how many people\u2019s time is affected \u2014 the bigger the team touching inventory, the more that small daily inefficiencies add up.',
  laborWastePct:    'Time spent counting, re-keying, and reconciling is time not spent on higher-value work. This helps estimate how much of it could be given back.',
  currentAccuracy:  'The gap between what your records say and what\u2019s actually on the shelf drives almost everything else \u2014 safety stock, write-offs, and missed orders.',
  annualWriteOff:   'Stock lost to damage, expiry, or shrinkage is money already spent that produced nothing. This is often the most tangible number to a CFO.',
  inventoryValue:   'How much cash is tied up in inventory sets the ceiling on how much working capital better accuracy could free.',
  invTurnsCurrent:  'How quickly inventory turns shows whether you\u2019re holding more than you need \u2014 slower turns usually mean trapped cash.',
  otifBaseline:     'On-time-in-full performance is what your customers feel. Even a few points of slippage can put real revenue at risk.',
  otifTarget:       'The gap between where you are and where you want to be defines the size of the service-level opportunity.',
  orderErrorPct:    'Every mis-picked or short order carries a cost \u2014 rework, returns, expedited reshipments, and eroded trust.',
  costPerError:     'Putting a dollar figure on a single order error lets us translate error rates into real money.',
  ordersPerYr:      'Order volume scales everything \u2014 a small per-order improvement multiplied across the year is often substantial.',
  downtimeEventsYr: 'Production or service interruptions caused by parts not being where the record said are among the most expensive and preventable losses.',
  expediteSpendYr:  'Rush freight and expediting fees are a direct symptom of not trusting inventory data \u2014 and a cost that usually shrinks with accuracy.',
  costPerTruckRoll: 'A repeat visit for a missing part carries labor, vehicle, and opportunity cost \u2014 this quantifies what each one really costs.',
  repeatVisitsYr:   'How often technicians return for a wrong or missing part shows how much first-visit success could improve.',
  fieldInventoryValue:'Parts on trucks and in the field are easy to lose track of \u2014 this sizes how much value is exposed to leakage.',
  revenuePerJob:    'When technicians spend less time hunting parts, they can complete more billable work \u2014 this helps value that recovered capacity.',
  itCost:           'What you spend maintaining current tools and workarounds is part of the true cost of the status quo.',
  discRate:         'Your finance team\u2019s hurdle rate lets any business case be judged on your own terms, not ours.'
};
function contextForQuestion(q) {
  if (!q || !q.sync) return '';
  return QUESTION_CONTEXT[q.sync] || '';
}

/* "Not sure" is recorded for the rep, but does not count as data. */
var NOT_SURE_TOKEN = 'not sure';
function isRealAnswer(val) {
  const v = (val || '').trim();
  return v.length > 0 && v.toLowerCase() !== NOT_SURE_TOKEN;
}

/* Per-driver progress: how many of its questions this questionnaire asks,
   and how many the prospect has genuinely answered. */
function computeDriverProgress() {
  const sections = getProspectQuestions((sessionData && sessionData.industry) || 'default', { hasFieldInventory: sessionData && !!sessionData.has_field_inventory });
  const out = {};
  Object.keys(VALUE_DRIVERS).forEach(k => { out[k] = { total: 0, answered: 0 }; });
  sections.forEach(sec => sec.questions.forEach(q => {
    const d = driverForQuestion(q);
    if (!d) return;
    out[d].total++;
    if (isRealAnswer(prospectAnswers[q.id])) out[d].answered++;
  }));
  return out;
}

function renderValuePanel() {
  const host = document.getElementById('valuePanel');
  if (!host) return;
  const prog = computeDriverProgress();
  const active = Object.keys(VALUE_DRIVERS).filter(k => prog[k].total > 0);
  if (!active.length) { host.innerHTML = ''; return; }

  const unlocked = active.filter(k => prog[k].answered > 0).length;
  const rows = active.map(k => {
    const d = VALUE_DRIVERS[k], p = prog[k];
    const done = p.answered >= p.total && p.total > 0;
    const started = p.answered > 0;
    const remaining = Math.max(0, p.total - p.answered);
    const state = done ? 'vd-done' : started ? 'vd-part' : 'vd-todo';
    const mark = done ? '&#10003;' : started ? '&#9679;' : '&#9675;';
    const status = done
      ? 'Complete'
      : started
        ? `${remaining} more to complete`
        : `${p.total} question${p.total !== 1 ? 's' : ''}`;
    return `<li class="vd-row ${state}">
        <span class="vd-mark" aria-hidden="true">${mark}</span>
        <span class="vd-body">
          <span class="vd-label">${escapeHtml(d.label)}</span>
          <span class="vd-blurb">${escapeHtml(d.blurb)}</span>
        </span>
        <span class="vd-status">${status}</span>
      </li>`;
  }).join('');

  host.innerHTML = `
    <div class="vp-head">
      <div>
        <div class="vp-title">What your answers help assess</div>
        <div class="vp-sub">${unlocked} of ${active.length} areas covered so far. Each area below becomes clearer as you answer \u2014 partial answers still help.</div>
      </div>
    </div>
    <ul class="vd-list">${rows}</ul>`;
}

/* Rough reading/answering time left, to set expectations and cut abandonment. */
function estimateMinutesLeft(remaining) {
  const mins = Math.ceil((remaining * 20) / 60); // ~20s per question
  if (remaining <= 0) return '';
  return mins <= 1 ? 'about a minute left' : `about ${mins} minutes left`;
}

function updateProgress() {
  const sections = getProspectQuestions((sessionData && sessionData.industry) || 'default', { hasFieldInventory: sessionData && !!sessionData.has_field_inventory });
  const total = sections.reduce((s, sec) => s + sec.questions.length, 0);
  const answered = Object.keys(prospectAnswers)
    .filter(k => !k.endsWith('_by') && isRealAnswer(prospectAnswers[k])).length;
  const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const meta = document.getElementById('progressMeta');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = `${answered} of ${total} answered`;
  if (meta) {
    const left = estimateMinutesLeft(total - answered);
    const milestone =
      pct >= 100 ? 'All questions answered \u2014 thank you.' :
      pct >= 75  ? 'Nearly there \u2014 this is already a strong picture.' :
      pct >= 40  ? 'Good progress \u2014 enough to see the main patterns.' :
      pct >= 15  ? 'Off to a good start.' : '';
    meta.textContent = [pct + '%', left, milestone].filter(Boolean).join(' \u00b7 ');
  }
  renderValuePanel();
}

function updateSaveButton() {
  const answered = Object.keys(prospectAnswers).filter(k => !k.endsWith('_by') && prospectAnswers[k]?.trim()).length;
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  if (btn) btn.disabled = answered === 0;
  if (status) {
    if (answered === 0) status.textContent = 'Answer at least one question to submit.';
    else if (answered < 5) status.textContent = `${answered} answered — you can submit now or continue adding more.`;
    else status.textContent = `${answered} questions answered. Ready to submit when you\'re done.`;
    status.className = 'save-status';
  }
}

/* Push a single answer to the DB immediately (called per-answer with debounce) */
async function pushAnswer(questionId, answer, enteredBy) {
  if (!sessionData?.token) return;
  setAutosaveState('saving');
  try {
    const r = await fetch(
      '/api/discovery/sessions/' + encodeURIComponent(sessionData.token) + '/answers',
      {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ questionId, answer, enteredBy: enteredBy || 'prospect' })
      }
    );
    setAutosaveState(r && r.ok ? 'saved' : 'error');
  } catch(e) {
    console.error('pushAnswer error:', e.message);
    setAutosaveState('error');
  }
}

/* Visible autosave reassurance — a persistent indicator so the prospect
   always knows their answers are being saved as they go. */
function setAutosaveState(state) {
  const el = document.getElementById('autosaveIndicator');
  if (!el) return;
  el.style.display = 'inline-flex';
  if (state === 'saving') { el.className = 'autosave saving'; el.innerHTML = '<span class="as-dot"></span> Saving…'; }
  else if (state === 'saved') { el.className = 'autosave saved'; el.innerHTML = '✓ All answers saved automatically'; }
  else { el.className = 'autosave error'; el.innerHTML = '⚠ Couldn\'t save — check your connection'; }
}

async function autoSave() {
  /* Answers are written individually via pushAnswer() on every keystroke.
     autoSave() just updates the UI status indicator.                      */
  const status = document.getElementById('saveStatus');
  if (status) {
    status.textContent = '✓ Progress saved to server';
    status.className = 'save-status saved';
    setTimeout(() => { updateSaveButton(); }, 2000);
  }
}

/* Submit now goes through a review step first, so the prospect sees exactly
   what they are sending and can correct it. Confirming completes the submit. */
function submitAnswers() { renderReview(); }

function renderReview() {
  const sections = getProspectQuestions((sessionData && sessionData.industry) || 'default', { hasFieldInventory: sessionData && !!sessionData.has_field_inventory });
  const total = sections.reduce((s, sec) => s + sec.questions.length, 0);
  const answered = Object.keys(prospectAnswers)
    .filter(k => !k.endsWith('_by') && isRealAnswer(prospectAnswers[k])).length;
  const unsureCount = Object.keys(prospectAnswers)
    .filter(k => !k.endsWith('_by') && (prospectAnswers[k] || '').trim().toLowerCase() === NOT_SURE_TOKEN).length;
  const blank = Math.max(0, total - answered - unsureCount);

  const blocks = sections.map(sec => {
    const rows = sec.questions.map(q => {
      const raw = (prospectAnswers[q.id] || '').trim();
      const unsure = raw.toLowerCase() === NOT_SURE_TOKEN;
      const real = isRealAnswer(raw);
      let val;
      if (unsure)      val = '<span class="rv-unsure">Not sure</span>';
      else if (!real)  val = '<span class="rv-blank">Not answered</span>';
      else             val = escapeHtml(q.type === 'percent' ? raw + '%' : (q.type === 'number' ? formatNumDisplay(raw) : raw));
      return `<li class="rv-row">
          <span class="rv-q">${escapeHtml(q.text)}</span>
          <span class="rv-a">${val}</span>
          <button type="button" class="rv-edit" onclick="editAnswer('${q.id}')">Edit</button>
        </li>`;
    }).join('');
    return `<div class="rv-sec">
        <div class="rv-sec-title">${getSectionIcon(sec.section)} ${escapeHtml(sec.section)}</div>
        <ul class="rv-list">${rows}</ul>
      </div>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="rv-head">
      <div class="rv-title">Review your answers</div>
      <div class="rv-sub">
        Please check these over before sending. ${answered} answered${unsureCount ? `, ${unsureCount} marked \u201cnot sure\u201d` : ''}${blank ? `, ${blank} left blank` : ''}.
        Blank and \u201cnot sure\u201d answers are fine \u2014 they tell your Cloud Inventory contact where to help.
      </div>
      <div class="rv-actions">
        <button class="save-btn" onclick="confirmSubmit()">Confirm and send</button>
        <button class="rv-back" onclick="backToForm()">Back to questions</button>
      </div>
    </div>
    ${blocks}
    <div class="rv-foot">
      <button class="save-btn" onclick="confirmSubmit()">Confirm and send</button>
      <button class="rv-back" onclick="backToForm()">Back to questions</button>
    </div>
    <div style="height:60px;"></div>`;
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function backToForm() {
  renderQuestionnaire(_currentSectionIdx);
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function editAnswer(id) {
  /* Find which section the question is in, then jump there */
  var sections = getProspectQuestions(sessionData.industry || 'default', { hasFieldInventory: sessionData && !!sessionData.has_field_inventory });
  var targetSection = _currentSectionIdx;
  sections.forEach(function(sec, i) {
    if (sec.questions.some(function(q){ return q.id === id; })) targetSection = i;
  });
  renderQuestionnaire(targetSection);
  setTimeout(function() {
    var wrap  = document.getElementById('wrap-' + id);
    var field = document.getElementById('pq-'  + id);
    if (wrap) {
      wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
      wrap.classList.add('rv-flash');
      setTimeout(function(){ wrap.classList.remove('rv-flash'); }, 1600);
    }
    if (field) field.focus({ preventScroll: true });
  }, 60);
}

async function confirmSubmit() {
  const answered = Object.keys(prospectAnswers)
    .filter(k => !k.endsWith('_by') && isRealAnswer(prospectAnswers[k])).length;

  /* Tell the server the prospect has confirmed submission — this stamps
     submitted_at on the session and emails the rep. Fire-and-forget:
     the thank-you screen shows regardless of whether the call succeeds. */
  try {
    await fetch('/api/discovery/sessions/' + encodeURIComponent(sessionData.token) + '/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });
  } catch (e) {
    console.warn('submit endpoint error (non-blocking):', e.message);
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="complete-card">
      <div class="complete-icon">&#127881;</div>
      <div class="complete-title">Thank you &#8212; answers submitted!</div>
      <div class="complete-sub">
        Your ${answered} responses have been saved and are ready for your Cloud Inventory contact to review.
        <br/><br/>
        They will use your answers to build a tailored business case and reach out to discuss next steps.
        <br/><br/>
        You can safely close this window.
      </div>
    </div>`;

  document.getElementById('progressLabel').textContent = answered + ' answers submitted \u2713';
  document.getElementById('progressFill').style.width = '100%';
  const meta = document.getElementById('progressMeta');
  if (meta) meta.textContent = 'Submitted \u2014 thank you.';
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('saveBtn').textContent = 'Submitted \u2713';
}

function getSectionIcon(title) {
  const map = {
    'Labor': '👷', 'Field': '🔧', 'Production': '🏭', 'Site': '🏗',
    'Maintenance': '⚙️', 'Warehouse': '📦', 'Store': '🏪',
    'Inventory': '📋', 'Parts': '🔩', 'Material': '🧱', 'Spares': '🔩',
    'Order': '📬', 'Customer': '🤝', 'Network': '📡', 'Regulatory': '📜',
    'Compliance': '✅', 'Supply': '🚛', 'Expiry': '📅',
    'Revenue': '💰', 'Financial': '💰', 'Systems': '💻', 'Technology': '💻',
    'Production': '🏭', 'Project': '📐'
  };
  const word = Object.keys(map).find(k => title.includes(k));
  return map[word] || '❓';
}

function getIndustryLabel(industry) {
  const labels = {
    telecom:'Telecommunications', mfg:'Manufacturing', construction:'Engineering & Construction',
    oil:'Oil & Gas', mining:'Minerals & Mining', distribution:'Distribution & 3PL',
    food:'Food & Beverage', retail:'Retail', default:'operations'
  };
  return labels[industry] || 'operations';
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('DOMContentLoaded', init);
</script>
<button class="p-to-top p-to-top-hidden" id="pToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V4M4 7l4-4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<script>
(function(){
  var btn=document.getElementById('pToTop');if(!btn)return;
  var ticking=false;
  function update(){ticking=false;var y=window.scrollY||document.documentElement.scrollTop||0;btn.classList.toggle('p-to-top-hidden',y<400);}
  window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(update);}},{passive:true});
  update();
})();
</script>
