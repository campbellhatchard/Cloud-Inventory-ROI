<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cloud Inventory — Business Value Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#042C53;--cyan:#00AEEF;--cyan-dark:#0090C5;--cyan-pale:#E0F5FD;
  --green:#2E7D32;--green-pale:#E8F5E9;--red:#C62828;
  --amber:#E65100;--amber-pale:#FFF3E0;--purple:#5B2D8E;
  --teal:#0F6E56;--brown:#854F0B;
  --gray-50:#F8FAFC;--gray-100:#F1F5F9;--gray-200:#E2E8F0;
  --gray-400:#94A3B8;--gray-500:#64748B;--gray-600:#475569;
  --gray-700:#334155;--gray-800:#1E293B;--white:#FFFFFF;
  --font:'Inter',system-ui,sans-serif;
}
body{font-family:var(--font);background:#EAECEF;color:var(--gray-800);font-size:14px;}

/* Toolbar */
.toolbar{position:fixed;top:0;left:0;right:0;background:var(--navy);padding:10px 20px;display:flex;align-items:center;gap:12px;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.tb-logo{height:28px;object-fit:contain;}
.tb-title{color:rgba(255,255,255,.55);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scenario-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:6px;padding:3px;gap:2px;}
.stog{padding:5px 12px;font-size:12px;font-weight:600;border-radius:4px;cursor:pointer;border:none;font-family:var(--font);color:rgba(255,255,255,.5);background:transparent;transition:all .15s;}
.stog.on{background:#fff;color:var(--navy);}
.ml{font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap;}
.tbtn{padding:8px 16px;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;border:none;font-family:var(--font);}
.tbtn.p{background:var(--cyan);color:#fff;}.tbtn.p:hover{background:var(--cyan-dark);}
.tbtn.g{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);}

/* Page */
.page-wrap{padding:68px 20px 40px;max-width:900px;margin:0 auto;}
.doc{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.15);}

/* Cover */
.cover{background:var(--navy);position:relative;overflow:hidden;}
.cover-accent{height:5px;background:linear-gradient(90deg,var(--cyan) 0%,rgba(0,174,239,.2) 100%);}
.cover-inner{padding:2.5rem 3rem 2rem;position:relative;z-index:1;}
.cov-bg1{position:absolute;right:-60px;top:-40px;width:320px;height:320px;background:rgba(0,174,239,.07);border-radius:50%;pointer-events:none;}
.cov-bg2{position:absolute;right:60px;bottom:-80px;width:200px;height:200px;background:rgba(0,174,239,.04);border-radius:50%;pointer-events:none;}
.cov-logos{display:flex;align-items:center;gap:14px;margin-bottom:2rem;}
.cov-logo-ci{height:36px;object-fit:contain;}
.cov-sep{color:rgba(255,255,255,.2);font-size:18px;font-weight:200;}
.cov-logo-p{height:32px;background:#fff;border-radius:6px;padding:3px 10px;object-fit:contain;}
.cov-eye{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase;margin-bottom:8px;}
.cov-co{font-size:30px;font-weight:300;color:#fff;letter-spacing:-.01em;line-height:1.15;margin-bottom:6px;}
.cov-meta{font-size:12px;color:rgba(255,255,255,.4);display:flex;gap:0 14px;flex-wrap:wrap;margin-bottom:1.5rem;}
.cov-meta span::before{content:'·';margin-right:14px;color:rgba(255,255,255,.15);}
.cov-meta span:first-child::before{display:none;}
.cov-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}

/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--cyan);}
.kpi{background:#fff;padding:.95rem 1.25rem;border-right:1px solid var(--gray-100);text-align:center;}
.kpi:last-child{border-right:none;}
.kpi-v{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:3px;}
.kpi-v.g{color:var(--green);}.kpi-v.b{color:var(--navy);}.kpi-v.c{color:var(--cyan-dark);}.kpi-v.r{color:var(--red);}
.kpi-l{font-size:10px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;}
.kpi-s{font-size:9px;color:var(--gray-400);margin-top:2px;}

/* Body */
.body{padding:2.5rem 3rem;}
.sec{margin-bottom:2.25rem;page-break-inside:avoid;}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:7px;border-bottom:2px solid var(--cyan);}
.sn{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.st{font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.08em;}
.sbadge{margin-left:auto;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--cyan-pale);color:var(--cyan-dark);}

/* Exec summary grid */
.esm{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}
.esc{border-radius:8px;padding:.95rem 1.1rem;border:1px solid var(--gray-100);}
.esc.pri{border-width:2px;}
.esc.sec{background:var(--gray-50);opacity:.82;}
.esc-aud{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.esc-h{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:5px;line-height:1.35;}
.esc-d{font-size:11px;color:var(--gray-600);line-height:1.6;}

/* Three Whys */
.why{border-radius:8px;padding:.9rem 1.1rem;margin-bottom:.7rem;}
.why-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px;}
.why-sub{font-size:10px;color:var(--gray-400);font-style:italic;margin-bottom:6px;}
.why-txt{font-size:11px;color:var(--gray-700);line-height:1.7;}

/* Charts */
.wf-row{display:grid;grid-template-columns:175px 1fr 80px;align-items:center;gap:9px;margin-bottom:6px;}
.wf-lbl{font-size:11px;color:var(--gray-600);text-align:right;}
.wf-track{background:var(--gray-100);border-radius:4px;height:25px;overflow:hidden;}
.wf-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:7px;}
.wf-val{font-size:11px;font-weight:700;color:var(--gray-800);text-align:right;}
.wf-total{display:grid;grid-template-columns:175px 1fr 80px;gap:9px;border-top:2px solid var(--gray-200);padding-top:7px;margin-top:4px;}

/* Donut */
.dnut{display:grid;grid-template-columns:190px 1fr;gap:1.25rem;align-items:center;}
.dleg{display:flex;flex-direction:column;gap:7px;}
.dl-row{display:flex;align-items:center;gap:7px;font-size:11px;}
.dl-sw{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.dl-lbl{color:var(--gray-600);flex:1;}
.dl-val{font-weight:700;color:var(--navy);}
.dl-pct{color:var(--gray-400);font-size:10px;}

/* Proviso */
.prov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:.75rem;}
.prov{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:.85rem;display:flex;gap:9px;}
.pv-icon{font-size:17px;flex-shrink:0;margin-top:1px;}
.pv-lbl{font-size:9px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.pv-val{font-size:15px;font-weight:800;color:var(--navy);line-height:1.1;margin-bottom:2px;}
.pv-det{font-size:10px;color:var(--gray-500);line-height:1.4;}

/* Risk */
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;}
.risk-cell{border-radius:8px;padding:.9rem;text-align:center;}
.risk-per{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.risk-amt{font-size:20px;font-weight:800;color:var(--red);letter-spacing:-.02em;}
.risk-sub{font-size:10px;color:var(--gray-400);margin-top:2px;}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:11px;}
.tbl th{background:var(--navy);color:#fff;padding:7px 10px;font-weight:600;text-align:right;font-size:10px;letter-spacing:.03em;}
.tbl th.l,.tbl td.l{text-align:left;}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--gray-100);text-align:right;color:var(--gray-700);}
.tbl tr:nth-child(even) td{background:var(--gray-50);}
.tbl td.pos{color:var(--green);font-weight:700;}.tbl td.neg{color:var(--red);}
.tbl td.blu{color:var(--navy);font-weight:700;}
.tbl tfoot td{background:#E0F5FD;font-weight:700;border-top:2px solid var(--cyan);color:var(--navy);}
.tbl tr.orow td{background:var(--amber-pale);font-style:italic;color:var(--gray-500);}
.rtag{font-size:9px;color:var(--brown);font-weight:700;}

.atbl{width:100%;border-collapse:collapse;font-size:11px;}
.atbl th{background:var(--cyan-pale);color:var(--navy);padding:6px 9px;font-weight:700;font-size:10px;text-align:left;}
.atbl td{padding:5px 9px;border-bottom:1px solid var(--gray-100);color:var(--gray-600);}
.atbl td:last-child{text-align:right;font-weight:600;color:var(--navy);}

.itbl{width:100%;border-collapse:collapse;font-size:11px;}
.itbl th{background:var(--navy);color:#fff;padding:7px 10px;font-weight:600;font-size:10px;}
.itbl td{padding:6px 10px;border-bottom:1px solid var(--gray-100);color:var(--gray-700);}
.itbl td:nth-child(2){color:var(--gray-400);font-size:10px;}
.itbl td:last-child{text-align:right;font-weight:600;}
.itbl tr:nth-child(even) td{background:var(--gray-50);}
.itbl tfoot td{background:#E0F5FD;font-weight:700;border-top:2px solid var(--cyan);color:var(--navy);}
.itbl tfoot td:last-child{text-align:right;}

.ctbl{width:100%;border-collapse:collapse;font-size:11px;}
.ctbl th{background:var(--navy);color:#fff;padding:7px 10px;font-weight:600;font-size:10px;text-align:center;}
.ctbl th.l{text-align:left;}
.ctbl td{padding:6px 10px;border-bottom:1px solid var(--gray-100);text-align:center;color:var(--gray-600);}
.ctbl td.l{text-align:left;color:var(--gray-700);}
.ctbl tr:nth-child(even) td{background:var(--gray-50);}
.ciy{color:var(--green);font-weight:800;font-size:14px;}.cin{color:var(--red);font-weight:800;font-size:14px;}.cip{color:var(--amber);font-weight:800;}
.cn{font-size:9px;color:var(--gray-400);}

/* Comp */
.comp-h{background:var(--navy);border-radius:8px 8px 0 0;padding:.85rem 1.1rem;}
.comp-nm{font-size:14px;font-weight:700;color:#fff;margin-bottom:.5rem;}
.comp-mt{display:flex;gap:1.5rem;flex-wrap:wrap;}
.cmt-l{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.cmt-v{font-size:11px;font-weight:600;color:var(--cyan);}
.comp-b{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--gray-200);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;}
.cc{padding:.85rem 1rem;}
.cc.pain{background:var(--gray-50);}
.cc.adv{background:#F0FFF4;}
.cc-t{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.cc.pain .cc-t{color:var(--red);}.cc.adv .cc-t{color:var(--green);}
.cc-row{display:flex;gap:6px;font-size:10px;color:var(--gray-600);margin-bottom:5px;line-height:1.4;}
.cx{color:var(--red);font-weight:700;flex-shrink:0;}.ck{color:var(--green);font-weight:700;flex-shrink:0;}

/* Proof */
.proof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;}
.pfc{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:.85rem;}
.pf-co{font-size:10px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.pf-r{font-size:11px;color:var(--gray-700);margin-bottom:4px;line-height:1.4;}
.pf-m{font-size:11px;font-weight:700;color:var(--green);}

/* Phases */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);}
.ph-card{}
.ph-hd{padding:.65rem .9rem;color:#fff;}
.ph-num{font-size:9px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px;}
.ph-nm{font-size:12px;font-weight:700;margin-bottom:1px;}
.ph-wk{font-size:10px;opacity:.7;}
.ph-steps{background:var(--gray-50);border:1px solid var(--gray-200);border-top:none;padding:.65rem .9rem;}
.ph-step{font-size:10px;color:var(--gray-600);padding:3px 0;border-bottom:1px solid var(--gray-100);line-height:1.4;}
.ph-step:last-child{border-bottom:none;}

/* Next steps */
.ns-row{display:flex;gap:1rem;margin-bottom:.85rem;}
.ns-n{width:27px;height:27px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.ns-by{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.ns-act{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px;}
.ns-det{font-size:11px;color:var(--gray-500);line-height:1.5;}
.ns-cta{background:var(--navy);border-radius:8px;padding:1rem 1.5rem;text-align:center;margin-top:.5rem;}
.ns-cta-t{font-size:15px;font-weight:700;color:#fff;}
.ns-cta-s{font-size:11px;color:rgba(255,255,255,.35);margin-top:4px;}

/* Footer */
.doc-ft{padding:1rem 3rem;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--gray-100);background:var(--gray-50);}
.ft-logo{height:22px;background:#fff;border:1px solid var(--gray-200);border-radius:5px;padding:2px 8px;object-fit:contain;}
.ft-txt{font-size:9px;color:var(--gray-400);}
.fn{font-size:9px;color:var(--gray-400);margin-top:6px;line-height:1.5;font-style:italic;}
.two-g{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}

.err{text-align:center;padding:4rem;color:var(--gray-400);}
.err h2{color:var(--navy);margin-bottom:8px;}

@media print{
  body{background:#fff;}
  .toolbar{display:none!important;}
  .page-wrap{padding:0;max-width:100%;}
  .doc{box-shadow:none;border-radius:0;}
  @page{margin:.4in .55in;size:letter;}
  .sec{page-break-inside:avoid;}
  .cover,.kpi-strip,.body,.doc-ft,.tbl th,.tbl tfoot td,
  .comp-h,.ph-hd,.ns-cta,.esc,.why,.prov,.risk-cell{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
}
</style>
</head>
<body>
<div class="toolbar">
  <img class="tb-logo" src="ci-logo-negative.png" alt="Cloud Inventory" onerror="this.style.display='none'"/>
  <span class="tb-title" id="tbTitle">Business Value Assessment</span>
  <div class="scenario-toggle" id="scenToggle" style="display:none;">
    <button class="stog" data-mode="conservative" onclick="setMode('conservative')">Conservative</button>
    <button class="stog on"  data-mode="base"         onclick="setMode('base')">Base case</button>
    <button class="stog" data-mode="aggressive" onclick="setMode('aggressive')">Aggressive</button>
  </div>
  <span class="ml" id="modeLabel">Base case</span>
  <button class="tbtn p" onclick="window.print()">⬇ Save PDF</button>
  <button class="tbtn g" onclick="window.close()">Close</button>
</div>

<div class="page-wrap">
  <div class="doc"><div id="out"></div></div>
</div>

<script src="app.js"></script>
<script src="features.js"></script>
<script src="narrative.js"></script>
<script>
const MODES={conservative:{lbl:'Conservative (70%)',scale:.7},base:{lbl:'Base case (100%)',scale:1},aggressive:{lbl:'Aggressive (130%)',scale:1.3}};
let curMode='base',baseVals=null;

function scaleV(v,s){
  if(s===1)return v;
  return{...v,mLabor:Math.min(v.mLabor*s,.95),mShrinkage:Math.min(v.mShrinkage*s,.95),
    mCarrying:Math.min(v.mCarrying*s,.95),mOtif:Math.min(v.mOtif*s,.95),mIt:Math.min(v.mIt*s,.95),
    effectiveShrinkBase:v.annualWriteOff>0?v.annualWriteOff:v.inventory*Math.min(v.shrinkRate*s,.20)};
}
function setMode(m){
  curMode=m;
  document.querySelectorAll('.stog').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  document.getElementById('modeLabel').textContent=MODES[m].lbl;
  render(baseVals,m);
}
function f(n){if(n==null||isNaN(n))return'—';const a=Math.abs(Math.round(n));if(a>=1e6)return(n<0?'-$':'$')+(a/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(a>=10000)return(n<0?'-$':'$')+Math.round(a/1000)+'K';return(n<0?'-$':'$')+a.toLocaleString();}
function ff(n){if(n==null||isNaN(n))return'—';return(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();}
function fp(n){return Math.round(n)+'%';}

/* ════════ SVG CHARTS ════════ */

function donutChart(r,sz=180){
  const COLS=['#185FA5','#2E7D32','#0F6E56','#854F0B','#6B3FA0','#3C3489'];
  const segs=[{l:'Labor savings',v:r.laborSav,c:COLS[0]},{l:'Write-off reduction',v:r.shrinkSav,c:COLS[1]},
    {l:'Carrying cost',v:r.carrySav,c:COLS[2]},{l:'OTIF protection',v:r.otifSav,c:COLS[3]},
    {l:'Turns (capital)',v:r.turnsSav,c:COLS[4]},{l:'IT displaced',v:r.itSav,c:COLS[5]}].filter(s=>s.v>0);
  const tot=segs.reduce((s,x)=>s+x.v,0);
  if(!tot)return'<p style="color:#94A3B8;font-size:11px;">No data.</p>';
  const cx=sz/2,cy=sz/2,R=sz*.43,ri=sz*.26;
  let sa=-Math.PI/2,paths='';
  segs.forEach(seg=>{
    const sw=(seg.v/tot)*2*Math.PI,ea=sa+sw;
    const x1=cx+R*Math.cos(sa),y1=cy+R*Math.sin(sa),x2=cx+R*Math.cos(ea),y2=cy+R*Math.sin(ea);
    const x3=cx+ri*Math.cos(ea),y3=cy+ri*Math.sin(ea),x4=cx+ri*Math.cos(sa),y4=cy+ri*Math.sin(sa);
    paths+=`<path d="M${x1},${y1} A${R},${R} 0 ${sw>Math.PI?1:0},1 ${x2},${y2} L${x3},${y3} A${ri},${ri} 0 ${sw>Math.PI?1:0},0 ${x4},${y4} Z" fill="${seg.c}" stroke="#fff" stroke-width="1.5"/>`;
    sa=ea;
  });
  const legend=segs.map(s=>`<div class="dl-row"><div class="dl-sw" style="background:${s.c}"></div><span class="dl-lbl">${s.l}</span><span class="dl-val">${f(s.v)}</span><span class="dl-pct">${Math.round(s.v/tot*100)}%</span></div>`).join('');
  return`<div class="dnut"><div><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${paths}<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="11" font-weight="800" fill="#042C53" font-family="Inter,sans-serif">${f(tot)}</text><text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="8" fill="#94A3B8" font-family="Inter,sans-serif">ANNUAL</text><text x="${cx}" y="${cy+19}" text-anchor="middle" font-size="8" fill="#94A3B8" font-family="Inter,sans-serif">BENEFIT</text></svg></div><div class="dleg">${legend}</div></div>`;
}

function waterfallBars(r){
  const bars=[{l:'Labor & productivity',v:r.laborSav,c:'#185FA5'},{l:'Write-off reduction',v:r.shrinkSav,c:'#2E7D32'},
    {l:'Carrying cost savings',v:r.carrySav,c:'#0F6E56'},{l:'OTIF protection',v:r.otifSav,c:'#854F0B'},
    {l:'Turns: capital freed',v:r.turnsSav,c:'#6B3FA0'},{l:'IT displaced',v:r.itSav,c:'#3C3489'}]
    .filter(b=>b.v>0).sort((a,b)=>b.v-a.v);
  const mx=Math.max(...bars.map(b=>b.v),1);
  return bars.map(b=>{
    const p=Math.round(b.v/mx*100);
    return`<div class="wf-row"><span class="wf-lbl">${b.l}</span><div class="wf-track"><div class="wf-fill" style="width:${p}%;background:${b.c};">${p>22?`<span style="font-size:10px;font-weight:700;color:#fff;">${fp(p)}</span>`:''}</div></div><span class="wf-val">${f(b.v)}</span></div>`;
  }).join('')+`<div class="wf-total"><span style="font-size:11px;font-weight:700;color:#042C53;text-align:right;">Total</span><div></div><span style="font-size:13px;font-weight:800;color:#042C53;text-align:right;">${ff(r.annualBenefit)}</span></div>`;
}

function npvCurve(r,v){
  const W=520,H=155,PL=62,PR=20,PT=20,PB=34,cW=W-PL-PR,cH=H-PT-PB;
  const pts=[{y:0,c:-v.otc}];
  let cum=-v.otc;
  r.cashflows.forEach(c=>{cum+=c.pv;pts.push({y:c.yr,c:cum});});
  const vals=pts.map(p=>p.c),mn=Math.min(...vals,0),mx=Math.max(...vals),rng=mx-mn||1;
  const px=yr=>PL+(yr/5)*cW,py=vv=>PT+cH-((vv-mn)/rng)*cH;
  let bx=null;
  for(let i=1;i<pts.length;i++){
    if(pts[i-1].c<0&&pts[i].c>=0){const frac=-pts[i-1].c/(pts[i].c-pts[i-1].c);bx=PL+((i-1+frac)/5)*cW;}
  }
  const pd=pts.map((p,i)=>`${i?'L':'M'}${px(p.y).toFixed(1)},${py(p.c).toFixed(1)}`).join(' ');
  const ad=pd+` L${px(5)},${py(0)} L${px(0)},${py(0)} Z`;
  const z0=py(0);
  const gl=[mx*.5,mx].filter(vv=>vv>mn+rng*.1).map(vv=>`<line x1="${PL}" y1="${py(vv).toFixed(0)}" x2="${PL+cW}" y2="${py(vv).toFixed(0)}" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/><text x="${PL-4}" y="${(py(vv)+4).toFixed(0)}" text-anchor="end" font-size="8" fill="#94A3B8" font-family="Inter,sans-serif">${f(vv)}</text>`).join('');
  const yl=[0,1,2,3,4,5].map(y=>`<text x="${px(y).toFixed(0)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#94A3B8" font-family="Inter,sans-serif">${y===0?'Now':'Yr '+y}</text>`).join('');
  const dd=pts.map(p=>`<circle cx="${px(p.y).toFixed(1)}" cy="${py(p.c).toFixed(1)}" r="3.5" fill="${p.c>=0?'#2E7D32':'#C62828'}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const bm=bx?`<line x1="${bx.toFixed(0)}" y1="${PT}" x2="${bx.toFixed(0)}" y2="${H-PB}" stroke="#00AEEF" stroke-width="1.5" stroke-dasharray="4,3"/><text x="${bx.toFixed(0)}" y="${PT-4}" text-anchor="middle" font-size="8" fill="#00AEEF" font-weight="700" font-family="Inter,sans-serif">Break-even</text>`:'';
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;max-width:100%;"><defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E7D32" stop-opacity=".25"/><stop offset="100%" stop-color="#2E7D32" stop-opacity="0"/></linearGradient></defs>${gl}<line x1="${PL}" y1="${z0.toFixed(0)}" x2="${PL+cW}" y2="${z0.toFixed(0)}" stroke="#CBD5E1" stroke-width="1.5"/><path d="${ad}" fill="url(#ng)"/><path d="${pd}" fill="none" stroke="#042C53" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${bm}${dd}${yl}<text x="${PL-4}" y="${(z0+3).toFixed(0)}" text-anchor="end" font-size="8" fill="#042C53" font-weight="700" font-family="Inter,sans-serif">$0</text></svg>`;
}

function scenChart(bv){
  const sc=Object.entries(MODES).map(([k,m])=>{
    const sv=scaleV(bv,m.scale),r=calcROI(sv);
    const c=k==='conservative'?'#854F0B':k==='base'?'#185FA5':'#2E7D32';
    return{k,lbl:k==='conservative'?'Conservative':k==='base'?'Base':'Aggressive',c,r};
  });
  const mb=Math.max(...sc.map(s=>s.r.annualBenefit));
  const mn=Math.max(...sc.map(s=>s.r.npv5),1);
  const rows=sc.map(s=>{
    const bp=Math.round(s.r.annualBenefit/mb*100);
    const np=Math.round(s.r.npv5/mn*100);
    const pb=s.r.paybackFromSigning===null?'—':s.r.paybackFromSigning>=60?'60+mo':s.r.paybackFromSigning.toFixed(1)+'mo';
    return`<tr><td class="l"><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:2px;background:${s.c};display:inline-block;"></span>${s.lbl}</span></td><td><div style="background:#F1F5F9;border-radius:3px;height:18px;overflow:hidden;"><div style="width:${bp}%;height:100%;background:${s.c};opacity:.8;"></div></div><div style="font-size:10px;font-weight:700;color:${s.c};text-align:right;margin-top:2px;">${f(s.r.annualBenefit)}</div></td><td style="font-weight:700;color:${s.c};">${fp(s.r.roi)}</td><td style="color:#475569;">${pb}</td><td><div style="background:#F1F5F9;border-radius:3px;height:18px;overflow:hidden;"><div style="width:${np}%;height:100%;background:${s.c};opacity:.65;"></div></div><div style="font-size:10px;font-weight:700;color:${s.c};text-align:right;margin-top:2px;">${f(s.r.npv5)}</div></td></tr>`;
  }).join('');
  return`<table style="width:100%;border-collapse:collapse;font-size:11px;"><thead><tr><th style="background:#042C53;color:#fff;padding:7px 10px;text-align:left;font-size:10px;width:105px;">Scenario</th><th style="background:#042C53;color:#fff;padding:7px 10px;font-size:10px;">Annual benefit</th><th style="background:#042C53;color:#fff;padding:7px 10px;font-size:10px;">Y1 ROI</th><th style="background:#042C53;color:#fff;padding:7px 10px;font-size:10px;">Payback</th><th style="background:#042C53;color:#fff;padding:7px 10px;font-size:10px;">5-yr NPV</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="5" style="padding:5px 10px;font-size:9px;color:#94A3B8;font-style:italic;background:#F8FAFC;">Conservative=70% · Aggressive=130% of base improvement assumptions · Investment costs fixed</td></tr></tfoot></table>`;
}

function paybackTimeline(r,v){
  const tot=Math.min(Math.max(r.paybackFromSigning||24,12)+4,60);
  const impl=v.implMonths||0,W=520,H=100,PL=56,PR=16,TY=50,TH=6,tW=W-PL-PR;
  const xAt=m=>PL+(m/tot)*tW,pbX=r.paybackFromSigning?xAt(Math.min(r.paybackFromSigning,tot)):null;
  const impX=xAt(impl),rampX=xAt(Math.min(impl+3,tot));
  const mos=[0,6,12,18,24,36,48,60].filter(m=>m<=tot);
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;max-width:100%;">
    <rect x="${PL}" y="${TY-TH/2}" width="${tW}" height="${TH}" rx="3" fill="#E2E8F0"/>
    ${impl>0?`<rect x="${PL}" y="${TY-TH/2}" width="${impX-PL}" height="${TH}" rx="3" fill="#854F0B"/>`:``}
    <rect x="${impX}" y="${TY-TH/2}" width="${rampX-impX}" height="${TH}" fill="#00AEEF"/>
    <rect x="${rampX}" y="${TY-TH/2}" width="${PL+tW-rampX}" height="${TH}" rx="3" fill="#2E7D32"/>
    ${impl>0?`<circle cx="${impX}" cy="${TY}" r="5" fill="#854F0B" stroke="#fff" stroke-width="1.5"/><text x="${impX}" y="${TY+16}" text-anchor="middle" font-size="8" fill="#854F0B" font-weight="700" font-family="Inter,sans-serif">Go-live</text><text x="${impX}" y="${TY+26}" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,sans-serif">Mo.${impl+1}</text>`:''}
    ${pbX?`<circle cx="${pbX}" cy="${TY}" r="7" fill="#fff" stroke="#042C53" stroke-width="2"/><text x="${pbX}" y="${TY+4}" text-anchor="middle" font-size="7" font-weight="800" fill="#042C53" font-family="Inter,sans-serif">✓</text><line x1="${pbX}" y1="${TY-10}" x2="${pbX}" y2="${TY-24}" stroke="#042C53" stroke-width="1.5" stroke-dasharray="2,2"/><text x="${pbX}" y="${TY-27}" text-anchor="middle" font-size="9" font-weight="700" fill="#042C53" font-family="Inter,sans-serif">Break-even ${r.paybackFromSigning.toFixed(1)} mo</text>`:''}
    ${mos.map(m=>`<text x="${xAt(m)}" y="${H-4}" text-anchor="middle" font-size="8" fill="#94A3B8" font-family="Inter,sans-serif">Mo.${m}</text><line x1="${xAt(m)}" y1="${TY+TH/2+2}" x2="${xAt(m)}" y2="${H-14}" stroke="#E2E8F0" stroke-width="1"/>`).join('')}
    <rect x="${PL}" y="8" width="9" height="5" rx="1" fill="#854F0B"/><text x="${PL+13}" y="14" font-size="8" fill="#64748B" font-family="Inter,sans-serif">Implementation</text>
    <rect x="${PL+95}" y="8" width="9" height="5" rx="1" fill="#00AEEF"/><text x="${PL+108}" y="14" font-size="8" fill="#64748B" font-family="Inter,sans-serif">Ramp-up</text>
    <rect x="${PL+162}" y="8" width="9" height="5" rx="1" fill="#2E7D32"/><text x="${PL+175}" y="14" font-size="8" fill="#64748B" font-family="Inter,sans-serif">Full efficiency</text>
  </svg>`;
}

    <!-- 12. Evaluation Criteria -->
    ${criteria.length?`
    <div class="sec">
      <div class="sh"><div class="sn">${secNum()}</div><span class="st">Evaluation framework</span></div>
      <table class="ctbl"><thead><tr><th class="l">Criterion</th><th>Cloud Inventory</th><th>${comp?comp.name:'Status quo'}</th><th class="l" style="font-size:9px;">Notes</th></tr></thead>
      <tbody>${criteria.map(c=>`<tr><td class="l">${c.criterion}</td><td class="ciy">✓</td><td class="${c.comp===false?'cin':c.comp===null?'cip':'ciy'}">${c.comp===false?'✗':c.comp===null?'~':'✓'}</td><td class="l cn">${c.note}</td></tr>`).join('')}</tbody></table>
      <p class="fn">✓ Full capability · ~ Partial / requires configuration · ✗ Not available</p>
    </div>`:''}

    <!-- 13. Implementation Phases -->
    ${timeline.length?`
    <div class="sec">
      <div class="sh"><div class="sn">◎</div><span class="st">Path to value — implementation phases</span></div>
      <div class="ph-grid">${timeline.map(ph=>`<div class="ph-card"><div class="ph-hd" style="background:${ph.color};"><div class="ph-num">${ph.phase}</div><div class="ph-nm">${ph.name}</div><div class="ph-wk">${ph.weeks}</div></div><div class="ph-steps">${ph.steps.map(s=>`<div class="ph-step">✓ ${s}</div>`).join('')}</div></div>`).join('')}</div>
    </div>`:''}

    <!-- 14. Assumptions -->
    <div class="sec">
      <div class="sh"><div class="sn">◎</div><span class="st">Input assumptions</span></div>
      <div class="two-g">
        <table class="atbl"><thead><tr><th colspan="2">Prospect profile</th></tr></thead><tbody>
          <tr><td>Annual revenue</td><td>${ff(sv.revenue)}</td></tr><tr><td>Inventory users</td><td>${Math.round(sv.users).toLocaleString()}</td></tr>
          <tr><td>Avg. labor cost / user / yr</td><td>${ff(sv.labor)}</td></tr><tr><td>Annual inventory value</td><td>${ff(sv.inventory)}</td></tr>
          <tr><td>Write-off baseline</td><td>${ff(sv.effectiveShrinkBase)}</td></tr>
          ${sv.otifBaseline>0?`<tr><td>Current OTIF</td><td>${sv.otifBaseline}% → ${sv.otifTarget}%</td></tr>`:''}
          ${sv.invTurnsCurrent>0?`<tr><td>Inventory turns</td><td>${sv.invTurnsCurrent}× vs ${sv.invTurnsBenchmark}× benchmark</td></tr>`:''}
          <tr><td>IT / legacy cost</td><td>${ff(sv.itCost)}</td></tr><tr><td>Discount rate</td><td>${fp(sv.discRate*100)}</td></tr>
        </tbody></table>
        <table class="atbl"><thead><tr><th colspan="2">Benchmarks${mode!=='base'?` (${mode})`:''}</th></tr></thead><tbody>
          <tr><td>Labor productivity gain</td><td>${fp(sv.mLabor*100)}</td></tr><tr><td>Write-off reduction</td><td>${fp(sv.mShrinkage*100)}</td></tr>
          <tr><td>Carrying cost reduction</td><td>${fp(sv.mCarrying*100)}</td></tr><tr><td>OTIF improvement</td><td>${fp(sv.mOtif*100)}</td></tr>
          <tr><td>IT cost displaced</td><td>${fp(sv.mIt*100)}</td></tr><tr><td>Carrying rate (baseline)</td><td>${fp(sv.carryRate*100)}</td></tr>
          <tr><td>Implementation duration</td><td>${sv.implMonths} months</td></tr><tr><td>Ramp Mo 1/2/3+</td><td>${Math.round(sv.ramp1*100)}% / ${Math.round(sv.ramp2*100)}% / ${Math.round(sv.ramp3*100)}%</td></tr>
        </tbody></table>
      </div>
    </div>

    <!-- 15. Next Steps -->
    ${nextSteps.length?`
    <div class="sec">
      <div class="sh"><div class="sn">◎</div><span class="st">Recommended next steps</span></div>
      ${nextSteps.map((s,i)=>`<div class="ns-row"><div class="ns-n">${i+1}</div><div><div class="ns-by">By ${s.by}</div><div class="ns-act">${s.action}</div><div class="ns-det">${s.detail}</div></div></div>`).join('')}
      <div class="ns-cta"><div class="ns-cta-t">Ready to move forward?</div><div class="ns-cta-s">Contact your Cloud Inventory representative · cloudinventory.com</div></div>
    </div>`:''}

  </div>

  <div class="doc-ft">
    <img class="ft-logo" src="ci-logo-full-color.png" alt="Cloud Inventory" onerror="this.style.display='none'"/>
    <span class="ft-txt">Business Value Assessment · ${sv.company||'Prospect'} · ${today} · Analysis uses industry benchmarks and prospect-supplied inputs. Actual results may vary. · cloudinventory.com</span>
  </div>`;

  document.getElementById('out').innerHTML=html;
  document.getElementById('tbTitle').textContent=`Business Value Assessment — ${sv.company||'Prospect'}`;
}

function init(){
  const hash=window.location.hash;
  if(!hash.startsWith('#data=')){
    document.getElementById('out').innerHTML='<div class="err"><h2>No scenario data</h2><p>Open from the ROI Calculator → Download PDF.</p></div>';
    return;
  }
  try{
    baseVals=JSON.parse(decodeURIComponent(escape(atob(hash.replace('#data=','')))));
    document.getElementById('scenToggle').style.display='flex';
    if(typeof threeWhys!=='undefined'){threeWhys.act=baseVals.threeWhysAct||'';threeWhys.ci=baseVals.threeWhysCi||'';threeWhys.now=baseVals.threeWhysNow||'';}
    render(baseVals,'base');
    if(new URLSearchParams(window.location.search).get('autoprint')==='1')setTimeout(()=>window.print(),1000);
  }catch(e){
    console.error(e);
    document.getElementById('out').innerHTML='<div class="err"><h2>Could not load scenario</h2><p>Data may be corrupted. Regenerate from the calculator.</p></div>';
  }
}
document.addEventListener('DOMContentLoaded',()=>setTimeout(init,150));
</script>
</body>
</html>
