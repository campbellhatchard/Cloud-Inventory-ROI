name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci_test
      REQUIRE_DATABASE_INTEGRATION: '1'
      JWT_SECRET: ci-test-secret
      ADMIN_PASSWORD: CloudInventory2026!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Engine tests
        run: npm run test:engine
      - name: Version consistency
        run: node test/version-consistency.test.js
      - name: Migration compatibility
        run: node test/migration-schema-compat.test.js
      - name: Phase 1 regression tests
        run: node test/phase1.test.js
      - name: PostgreSQL integration suites
        run: npm run test:postgres
      - name: Full release certification gates
        run: npm run release:gates
      - name: Upload release certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-inventory-roi-v6.9.14-certification-evidence
          if-no-files-found: error
          path: |
            POSTGRES_INTEGRATION_RESULTS_v6.9.14.json
            RELEASE_GATE_RESULTS_v6.9.14.json
            OUTPUT_RUNTIME_RESULTS_v6.9.14.json
