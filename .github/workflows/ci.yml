name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci_test
      JWT_SECRET: ci-test-secret
      ADMIN_PASSWORD: CloudInventory2026!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Engine tests
        run: npm run test:engine
      - name: Version consistency
        run: node test/version-consistency.test.js
      - name: Migration compatibility
        run: node test/migration-schema-compat.test.js
      - name: Phase 1 regression tests
        run: node test/phase1.test.js
      - name: Route/integration tests
        run: npm run test:routes

      - name: UI and startup regression tests
        run: node --test test/ui-regression.test.js test/production-regression-locks.test.js
      - name: Full application regression suite
        run: npm test
