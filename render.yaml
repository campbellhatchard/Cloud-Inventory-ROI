databases:
  - name: cloud-inventory-roi-db
    plan: basic-256mb
    databaseName: ciroi
    user: ciroi_user
    ipAllowList: []

services:
  - type: web
    name: cloud-inventory-roi
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 15

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-inventory-roi-db
          property: connectionString

      - key: NODE_VERSION
        value: 22.22.0

      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"

      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: "CloudInventory2026!"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@cloudinventory.com

      - key: NODE_ENV
        value: production

      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
