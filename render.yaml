databases:
  - name: cloud-inventory-roi-db
    # basic-256mb (~$6/mo): paid Postgres — persistent (free tier is deleted
    # after 30 days) and always available. Instance type sets RAM/CPU only.
    plan: basic-256mb
    databaseName: ciroi
    user: ciroi_user
    ipAllowList: []

services:
  - type: web
    name: cloud-inventory-roi
    runtime: node
    # starter (~$7/mo): never spins down — eliminates the free-tier cold-start
    # "loading" screen that appears after 15 min of inactivity.
    plan: starter
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 15

    envVars:
      # Database connection is injected automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-inventory-roi-db
          property: connectionString

      # Pin Node to a tested LTS major. Render's current default is newer.
      - key: NODE_VERSION
        value: 22.22.0

      # Authentication and password hashing.
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"

      # Initial administrator account. Change this password after first login.
      # WARNING: These values are visible to anyone who can read the repository.
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: "CloudInventory2026!"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@cloudinventory.com

      - key: NODE_ENV
        value: production
      # Optional AI model name. Add ANTHROPIC_API_KEY manually in Render if AI Enhance is required.
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Optional email variables SENDGRID_API_KEY and FROM_EMAIL can be added manually in Render.
