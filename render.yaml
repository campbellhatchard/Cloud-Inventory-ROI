databases:
  - name: cloud-inventory-roi-db
    plan: basic-256mb
    databaseName: ciroi
    user: ciroi_user
    ipAllowList: []

services:
  - type: web
    name: cloud-inventory-roi
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 15

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-inventory-roi-db
          property: connectionString

      - key: NODE_VERSION
        value: 22.22.0

      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"

      - key: NODE_ENV
        value: production

      # ── Secrets — set these in the Render dashboard, not here ──────
      # BOOTSTRAP_ADMIN_USERNAME   → set in Render dashboard
      # BOOTSTRAP_ADMIN_PASSWORD   → set in Render dashboard (min 12 chars)
      # BOOTSTRAP_ADMIN_EMAIL      → set in Render dashboard
      # ANTHROPIC_API_KEY          → set in Render dashboard (AI features)
      # SENDGRID_API_KEY           → set in Render dashboard (discovery emails)
      # FROM_EMAIL                 → set in Render dashboard (e.g. noreply@cloudinventory.com)

      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
