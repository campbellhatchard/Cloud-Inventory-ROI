databases:
  - name: cloud-inventory-roi-staging-db
    plan: basic-256mb
    databaseName: ciroi_staging
    user: ciroi_staging_user
    ipAllowList: []

services:
  - type: web
    name: cloud-inventory-roi-staging
    runtime: node
    plan: starter
    branch: staging
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 15

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-inventory-roi-staging-db
          property: connectionString

      - key: NODE_VERSION
        value: 22.22.0

      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"

      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: "CloudInventory2026!"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@cloudinventory.com

      # Use production mode in staging so startup, SSL, health, and migration
      # behavior match production. Keep environment separation at the Render
      # service/database level, not by weakening NODE_ENV behavior.
      - key: NODE_ENV
        value: production

      - key: APP_ENV
        value: staging

      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
