databases:
  - name: cloud-inventory-roi-db
    plan: free
    databaseName: ciroi
    user: ciroi_user
    ipAllowList: []

services:
  - type: web
    name: cloud-inventory-roi
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    # Run Node directly so Render's SIGTERM reaches the application process.
    startCommand: node server.js
    healthCheckPath: /health
    maxShutdownDelaySeconds: 15
    autoDeployTrigger: commit

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-inventory-roi-db
          property: connectionString

      - key: NODE_VERSION
        value: 22.22.0

      - key: NODE_ENV
        value: production

      - key: REQUIRE_DATABASE
        value: "true"

      # Allow the database created by the same Blueprint time to become ready.
      - key: DB_STARTUP_MAX_ATTEMPTS
        value: "60"
      - key: DB_STARTUP_RETRY_MS
        value: "3000"

      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"

      # Initial administrator account. Keep the repository private.
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: "CloudInventory2026!"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@cloudinventory.com

      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

# Optional secrets are intentionally omitted from this Blueprint so they do not
# block initial creation with interactive secret prompts. Add them manually in Render
# when needed: ANTHROPIC_API_KEY, SENDGRID_API_KEY, FROM_EMAIL, APP_URL.
