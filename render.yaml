databases:
  - name: cloud-inventory-roi-db
    plan: basic-256mb
    databaseName: ciroi
    user: ciroi_user
    ipAllowList: []

services:
  - type: web
    name: cloud-inventory-roi
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    preDeployCommand: npm run migrate
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 15

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-inventory-roi-db
          property: connectionString

      - key: NODE_VERSION
        value: 22.22.0

      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"

      - key: NODE_ENV
        value: production

      # Private Solution Fit evidence storage. Credentials are entered in
      # Render and are never exposed to the browser or committed to source.
      - key: STORAGE_MODE
        value: S3
      - key: S3_ENDPOINT
        value: https://eaca76ebb7eb4baa41e6b69405f46708.r2.cloudflarestorage.com
      - key: S3_BUCKET
        value: cloud-inventory-discovery-staging
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Render prompts for these values during the first Blueprint sync.
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

      # Optional integrations. Configure these later in the Render dashboard.
      # ANTHROPIC_API_KEY enables AI features.
      # SENDGRID_API_KEY and FROM_EMAIL enable email delivery.

      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
